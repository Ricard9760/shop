<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNEAKERS TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #ffffff; --surface: #f5f5f5; --text: #111111; --subtext: #777777;
            --border: #e0e0e0; --black: #000000; --danger: #d93025;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 85px; -webkit-tap-highlight-color: transparent; }
        header {
            position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
            padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .logo-box { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 17px; letter-spacing: 2.5px; cursor: pointer; user-select: none; }
        .logo-icon { border: 2px solid var(--black); padding: 2px 5px; font-size: 13px; font-weight: 900; }
        .currency-select { background: var(--bg); color: var(--text); border: 1px solid var(--black); padding: 5px 8px; font-weight: 700; font-size: 12px; outline: none; text-transform: uppercase; }
        .search-wrap { padding: 12px 16px 6px; }
        .search-input { width: 100%; background: var(--surface); border: none; border-radius: 20px; padding: 10px 16px; font-size: 14px; outline: none; color: var(--text); }
        .tabs { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; text-transform: uppercase; }
        .tab-btn.active { background: var(--black); color: #fff; border-color: var(--black); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px; }
        .card { position: relative; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; padding: 10px; cursor: pointer; background: var(--bg); }
        .sale-badge { position: absolute; top: 8px; left: 8px; background: var(--black); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 6px; text-transform: uppercase; z-index: 2; }
        .card img { width: 100%; height: 140px; object-fit: contain; background: #fafafa; margin-bottom: 8px; }
        .card-brand { font-size: 10px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; }
        .card-title { font-size: 13px; font-weight: 700; margin: 3px 0 6px; line-height: 1.25; }
        .price-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .old-price { font-size: 12px; color: #999; text-decoration: line-through; }
        .cur-price { font-size: 14px; font-weight: 800; color: var(--black); }
        .admin-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border); }
        .adm-mini-btn { font-size: 11px; font-weight: 700; padding: 5px; border: 1px solid var(--black); background: var(--bg); cursor: pointer; text-align: center; }
        .adm-mini-btn.del { border-color: var(--danger); color: var(--danger); }
        .section { display: none; }
        .section.active { display: block; }
        .detail-wrap { padding: 12px 16px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 12px; cursor: pointer; text-transform: uppercase; }
        .slider-box { position: relative; width: 100%; height: 270px; background: #fafafa; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; }
        .slide-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.85); border: 1px solid var(--border); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; }
        .slide-arrow.left { left: 8px; } .slide-arrow.right { right: 8px; }
        .dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0 14px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--black); background: transparent; cursor: pointer; }
        .dot.active { background: var(--black); }
        .detail-title { font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
        .detail-code { font-size: 12px; color: var(--subtext); margin-bottom: 12px; }
        .detail-prices { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
        .detail-old { font-size: 16px; color: #999; text-decoration: line-through; }
        .detail-cur { font-size: 20px; font-weight: 800; }
        .sizes-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
        .size-box { border: 1px solid var(--border); padding: 12px 0; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--bg); }
        .size-box.selected { border: 2px solid var(--black); font-weight: 800; }
        .size-chart-link { display: inline-block; font-size: 13px; color: var(--subtext); text-decoration: underline; margin-bottom: 18px; cursor: pointer; }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
        .btn-black { background: var(--black); color: #fff; border: 1px solid var(--black); padding: 13px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; text-align: center; width: 100%; }
        .btn-black:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { background: var(--bg); color: var(--black); border: 1px solid var(--black); padding: 13px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; text-align: center; width: 100%; }
        .variants-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
        .variants-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
        .var-thumb { width: 64px; height: 64px; border: 1px solid var(--border); padding: 3px; cursor: pointer; flex-shrink: 0; background: #fafafa; }
        .var-thumb.active { border: 2px solid var(--black); }
        .var-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .desc-box { border-top: 1px solid var(--border); padding-top: 14px; font-size: 14px; line-height: 1.5; color: #333; white-space: pre-line; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-card { background: var(--bg); width: 100%; max-width: 400px; padding: 18px; border: 1px solid var(--black); max-height: 85vh; overflow-y: auto; }
        .size-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
        .size-table th, .size-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        .size-table th { background: var(--surface); font-weight: 700; }
        .pad-section { padding: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--black); background: var(--bg); color: var(--text); font-size: 14px; border-radius: 0; outline: none; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--black); background: var(--surface); margin-bottom: 12px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .checkbox-row input { width: 18px; height: 18px; accent-color: var(--black); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); padding: 10px; margin-bottom: 8px; background: #fff; }
        .preview-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .preview-item { position: relative; width: 56px; height: 56px; border: 1px solid var(--border); }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-del { position: absolute; top: -6px; right: -6px; background: var(--black); color: #fff; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 30; }
        .nav-item { color: var(--subtext); font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .nav-item.active { color: var(--black); text-decoration: underline; text-underline-offset: 4px; }
        .status-box { padding: 10px; margin-bottom: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--black); background: #f0fff4; display: block; }
        .order-row-drag { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); padding: 8px 10px; margin-bottom: 6px; background: #fafafa; }
    </style>
</head>
<body>

<header>
    <div class="logo-box" onclick="handleLogoTap()">
        <span class="logo-icon">S</span> SNEAKERS
    </div>
    <select id="currency" class="currency-select" onchange="refreshAllPrices()">
        <option value="UAH" selected>₴ UAH</option>
        <option value="USD">$ USD</option>
        <option value="RUB">₽ RUB</option>
        <option value="USDT">₮ USDT</option>
    </select>
</header>

<div id="page-catalog" class="section active">
    <div class="search-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск модели или бренда..." oninput="renderCatalog()">
    </div>
    <div class="tabs" id="gender-tabs"></div>
    <div class="tabs" id="brand-tabs"></div>
    <div id="product-grid" class="grid"></div>
</div>

<div id="page-detail" class="section">
    <div class="detail-wrap">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div class="back-link" style="margin-bottom:0;" onclick="openPage('catalog')">← Назад в каталог</div>
            <div id="det-admin-btns" style="display:none; gap:8px;">
                <button class="adm-mini-btn" onclick="startEditProduct(activeProduct.id)">✏️ Изменить</button>
                <button class="adm-mini-btn del" onclick="deleteProduct(activeProduct.id)">🗑 Удалить</button>
            </div>
        </div>
        <div class="slider-box">
            <div class="slide-arrow left" onclick="changeSlide(-1)">‹</div>
            <img id="det-main-img" src="" alt="Sneaker">
            <div class="slide-arrow right" onclick="changeSlide(1)">›</div>
        </div>
        <div id="det-dots" class="dots"></div>
        <div id="det-title" class="detail-title"></div>
        <div id="det-code" class="detail-code"></div>
        <div class="detail-prices">
            <span id="det-old-price" class="detail-old"></span>
            <span id="det-cur-price" class="detail-cur"></span>
        </div>
        <div id="det-sizes" class="sizes-grid"></div>
        <div class="size-chart-link" onclick="openSizeModal()">Размерная сетка (см стопы)</div>
        <div class="action-row">
            <button class="btn-black" onclick="buyNowCurrent()">Быстрая покупка</button>
            <button class="btn-outline" onclick="addCurrentToCart()">Добавить в корзину</button>
        </div>
        <div id="det-variants-block" style="display:none;">
            <div class="variants-title">Другие цвета: (<span id="det-color-name"></span>)</div>
            <div id="det-variants" class="variants-row"></div>
        </div>
        <div id="det-desc" class="desc-box"></div>
    </div>
</div>

<div id="size-modal" class="modal-overlay" onclick="closeSizeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-size:15px; text-transform:uppercase;">📏 Размерная линейка</strong>
            <span style="cursor:pointer; font-size:18px; font-weight:bold;" onclick="closeSizeModal()">✕</span>
        </div>
        <div id="modal-size-content"></div>
        <img id="modal-size-img" src="" style="width:100%; margin-top:10px; display:none; border:1px solid #ddd;">
    </div>
</div>

<div id="page-cart" class="section pad-section">
    <h2 style="margin-bottom: 14px; font-size:18px; text-transform:uppercase;">Корзина</h2>
    <div id="cart-list"></div>
    <div id="cart-summary" style="margin-top: 18px; display: none;">
        <div class="form-group">
            <label>Имя и Фамилия *</label>
            <input type="text" id="ord-name" placeholder="Иван Иванов">
        </div>
        <div class="form-group">
            <label>Номер телефона *</label>
            <input type="tel" id="ord-phone" placeholder="+380...">
        </div>
        <div class="form-group">
            <label>Служба доставки *</label>
            <select id="ord-delivery">
                <option value="Новая Почта">Новая Почта</option>
                <option value="Укрпочта">Укрпочта</option>
                <option value="Самовывоз">Самовывоз</option>
            </select>
        </div>
        <div class="form-group">
            <label>Город *</label>
            <input type="text" id="ord-city" placeholder="Например: Киев">
        </div>
        <div class="form-group">
            <label>Улица и номер отделения / почтомата *</label>
            <input type="text" id="ord-branch" placeholder="Отделение №15 или ул. Крещатик 10">
        </div>
        <div class="form-group">
            <label>Способ оплаты</label>
            <select id="ord-pay">
                <option value="Наложенный платеж (при получении)">При получении (Наложенный платеж)</option>
                <option value="Оплата на карту">Оплата на карту</option>
                <option value="USDT / CryptoBot (@send)">Криптовалюта (USDT / @send)</option>
            </select>
        </div>
        <div id="total-price" style="font-size:18px; font-weight:800; margin: 16px 0;"></div>
        <button class="btn-black" onclick="submitOrder()">Оформить заказ</button>
    </div>
</div>

<div id="page-admin" class="section pad-section">
    <h2 style="margin-bottom: 10px; font-size:18px; text-transform:uppercase;">⚙️ Панель владельца</h2>
    
    <details id="cloud-settings-box" style="border:1px solid var(--black); padding:10px; margin-bottom:16px; background:var(--surface);">
        <summary style="font-size:12px; font-weight:800; cursor:pointer; text-transform:uppercase;">
            ☁️ Настройка GitHub (чтобы видели все)
        </summary>
        <div style="margin-top:10px;">
            <div class="form-group">
                <label>GitHub Репозиторий</label>
                <input type="text" id="cfg-repo" placeholder="Ricard9760/shop">
            </div>
            <div class="form-group">
                <label>GitHub Token (ghp_...)</label>
                <input type="password" id="cfg-gh-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <div class="form-group">
                <label>ImgBB API Key (для фото)</label>
                <input type="password" id="cfg-imgbb-key" placeholder="api.imgbb.com ключ">
            </div>
            <button class="btn-black" style="padding:9px;" onclick="saveCloudConfig()">💾 Сохранить настройки</button>
        </div>
    </details>

    <div id="admin-status" class="status-box" style="display:none;"></div>
    
    <details style="border:1px solid var(--black); padding:10px; margin-bottom:16px; background:var(--surface);">
        <summary style="font-size:12px; font-weight:800; cursor:pointer; text-transform:uppercase;">
            📂 Управление категориями
        </summary>
        <div style="margin-top:10px;">
            <div style="display:flex; gap:6px; margin-bottom:10px;">
                <input type="text" id="new-category-name" placeholder="Новая категория" style="padding:6px; font-size:13px; border:1px solid #000;">
                <button class="btn-black" style="width:auto; padding:6px 12px; font-size:11px;" onclick="addNewCategory()">+ Добавить</button>
            </div>
            <div id="manage-categories-list"></div>
        </div>
    </details>
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="form-mode-title" style="font-size:15px; text-transform:uppercase;">➕ Новый товар</h3>
        <button id="cancel-edit-btn" class="adm-mini-btn" style="display:none;" onclick="resetAdminForm()">✕ Отменить</button>
    </div>
    <input type="hidden" id="adm-edit-id" value="">
    <div class="form-group">
        <label>Категория товара</label>
        <select id="adm-gender"></select>
    </div>
    <div class="form-group">
        <label>Бренд (впиши любой)</label>
        <input type="text" id="adm-brand" placeholder="Например: Asics, Nike, Adidas">
    </div>
    <div class="form-group">
        <label>Название модели и код</label>
        <input type="text" id="adm-title" placeholder="Asics Gel NYC">
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <div class="form-group">
            <label>Цена *</label>
            <input type="number" id="adm-price" placeholder="4145">
        </div>
        <div class="form-group">
            <label>Валюта ввода</label>
            <select id="adm-cur">
                <option value="UAH">UAH (₴)</option>
                <option value="USD">USD ($)</option>
                <option value="RUB">RUB (₽)</option>
                <option value="USDT">₮ USDT</option>
            </select>
        </div>
    </div>
    <label class="checkbox-row">
        <input type="checkbox" id="adm-has-discount" onchange="toggleDiscountBox()">
        <span>🔥 Назначить скидку (перечеркнутая старая цена)</span>
    </label>
    <div id="discount-settings" style="display:none; border:1px solid var(--border); padding:10px; margin-bottom:12px; background:#fafafa;">
        <div class="form-group" style="margin-bottom:0;">
            <label>Старая цена до скидки</label>
            <input type="number" id="adm-old-price" placeholder="8810">
        </div>
    </div>
    <div class="form-group">
        <label>Фотографии товара</label>
        <input type="file" id="adm-photos" accept="image/*" multiple onchange="handleMultiPhotos(this)">
        <div id="adm-photo-preview" class="preview-strip"></div>
    </div>
    <div class="form-group">
        <label>Размеры и длина стопы в см</label>
        <textarea id="adm-sizes" rows="3">36=23см, 37=23.5см, 38=24см, 39=24.5см, 40=25см, 41=26см, 42=26.5см, 43=27.5см, 44=28см, 45=29см</textarea>
    </div>
    <div class="form-group">
        <label>Фото размерной сетки</label>
        <input type="file" id="adm-chart-file" accept="image/*" onchange="handleChartPhoto(this)">
        <div id="adm-chart-preview" class="preview-strip"></div>
    </div>
    <div class="form-group">
        <label>Описание товара</label>
        <textarea id="adm-desc" rows="3" placeholder="Описание..."></textarea>
    </div>
    <div style="border:1px solid var(--border); padding:10px; margin-bottom:14px; background:var(--surface);">
        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:6px;">🎨 ДРУГИЕ ЦВЕТА / ВАРИАНТЫ</label>
        <input type="text" id="var-color-name" placeholder="Название цвета" style="margin-bottom:6px;">
        <input type="file" id="var-color-file" accept="image/*" style="margin-bottom:6px;">
        <button type="button" class="btn-outline" style="padding:7px;" onclick="addVariantDraft()">+ Прикрепить цвет</button>
        <div id="var-draft-list" class="preview-strip" style="margin-top:8px;"></div>
    </div>
    <button id="save-prod-btn" class="btn-black" onclick="saveNewProduct()">✅ Сохранить и опубликовать для всех</button>
    <h3 style="margin: 24px 0 10px; font-size:15px; text-transform:uppercase; border-top:2px solid var(--black); padding-top:16px;">
        📦 Управление каталогом
    </h3>
    <div id="admin-products-list"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" id="nav-catalog" onclick="openPage('catalog')">Каталог</div>
    <div class="nav-item" id="nav-cart" onclick="openPage('cart')">Корзина (<span id="cart-count">0</span>)</div>
    <div class="nav-item" id="nav-admin" style="display:none;" onclick="openPage('admin')">➕ Админ</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const tgUser = (tg.initDataUnsafe?.user?.username || "").toLowerCase();
    let isOwner = (urlParams.get('admin') === '1') || (tgUser === 'endry_sit');

    function unlockAdminUI() {
        isOwner = true;
        document.getElementById('nav-admin').style.display = 'block';
        document.getElementById('det-admin-btns').style.display = 'flex';
        initCloudSettingsForm();
        renderAdminProductList();
        renderCategoryOptions();
        renderCategoryManagerUI();
    }

    function detectGitHubRepo() {
        const saved = localStorage.getItem('cfg_gh_repo');
        if (saved) return saved;
        return 'Ricard9760/shop';
    }

    function initCloudSettingsForm() {
        document.getElementById('cfg-repo').value = detectGitHubRepo();
        document.getElementById('cfg-gh-token').value = localStorage.getItem('cfg_gh_token') || '';
        document.getElementById('cfg-imgbb-key').value = localStorage.getItem('cfg_imgbb_key') || '';
    }

    function saveCloudConfig() {
        localStorage.setItem('cfg_gh_repo', document.getElementById('cfg-repo').value.trim());
        localStorage.setItem('cfg_gh_token', document.getElementById('cfg-gh-token').value.trim());
        localStorage.setItem('cfg_imgbb_key', document.getElementById('cfg-imgbb-key').value.trim());
        alert('✅ Настройки сохранены!');
        document.getElementById('cloud-settings-box').open = false;
        loadSharedCatalog();
    }

    let logoTapCount = 0;
    let logoTapTimer = null;
    function handleLogoTap() {
        openPage('catalog');
        logoTapCount++;
        clearTimeout(logoTapTimer);
        logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 1800);
        if (logoTapCount >= 5 && !isOwner) {
            logoTapCount = 0;
            const pin = prompt("Введите PIN владельца:");
            if (pin === "7777") {
                unlockAdminUI();
                openPage('admin');
            }
        }
    }

    function toggleDiscountBox() {

    async function syncCatalogToGitHub() {
        const repo = document.getElementById('cfg-repo').value.trim() || detectGitHubRepo();
        const token = localStorage.getItem('cfg_gh_token');
        if (!token) {
            alert('⚠️ Ошибка: не введен GitHub Token в настройках админки!');
            return false;
        }

        const statusEl = document.getElementById('admin-status');
        statusEl.style.display = 'block';
        statusEl.innerText = '⏳ Сохранение изменений для всех пользователей...';

        const apiUrl = `https://api.github.com/repos/${repo}/contents/products.json`;
        let sha = null;

        try {
            const getRes = await fetch(apiUrl, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }
        } catch (e) {}

        const contentStr = JSON.stringify(products, null, 2);
        const contentBase64 = btoa(unescape(encodeURIComponent(contentStr)));

        const bodyObj = {
            message: "Update shared sneaker catalog",
            content: contentBase64
        };
        if (sha) bodyObj.sha = sha;

        const putRes = await fetch(apiUrl, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(bodyObj)
        });

        if (putRes.ok) {
            statusEl.innerText = '✅ Успешно! Все пользователи видят изменения.';
            setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            return true;
        } else {
            const errJson = await putRes.json().catch(() => ({}));
            statusEl.innerText = '⚠️ Ошибка синхронизации с GitHub.';
            alert('⚠️ Ошибка GitHub: ' + (errJson.message || putRes.statusText));
            return false;
        }
    }

    function compressImageFile(file, maxWidth = 800, quality = 0.8) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(1, maxWidth / img.width);
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function uploadImageSmart(file, maxWidth = 800) {
        const dataUrl = await compressImageFile(file, maxWidth, 0.8);
        const imgbbKey = localStorage.getItem('cfg_imgbb_key');
        if (!imgbbKey) return dataUrl;
        try {
            const base64Clean = dataUrl.split(',')[1];
            const formData = new FormData();
            formData.append('image', base64Clean);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: 'POST', body: formData });
            const json = await res.json();
            if (json.success && json.data && json.data.url) return json.data.url;
        } catch (err) {}
        return dataUrl;
    }

    async function saveNewProduct() {
        if (!isOwner) return;
        const editId = document.getElementById('adm-edit-id').value;
        const gender = document.getElementById('adm-gender').value;
        const brand = document.getElementById('adm-brand').value.trim() || 'Sneakers';
        const title = document.getElementById('adm-title').value.trim();
        const rawPrice = Number(document.getElementById('adm-price').value);
        const hasDiscount = document.getElementById('adm-has-discount').checked;
        const rawOldPrice = hasDiscount ? Number(document.getElementById('adm-old-price').value) : 0;
        const inputCur = document.getElementById('adm-cur').value;
        const rawSizes = document.getElementById('adm-sizes').value.trim();
        const desc = document.getElementById('adm-desc').value.trim();

        if (!title || !rawPrice) { alert('Заполните название и цену!'); return; }

        const priceUSD = +(rawPrice / rates[inputCur].rate).toFixed(2);
        const oldPriceUSD = (hasDiscount && rawOldPrice > 0) ? +(rawOldPrice / rates[inputCur].rate).toFixed(2) : 0;

        const parsedSizes = rawSizes.split(/[,;\n]+/).map(part => {
            const [sz, cm] = part.split('=').map(s => s ? s.trim() : '');
            return sz ? { size: sz, cm: cm || '' } : null;
        }).filter(Boolean);

        const images = uploadedProductPhotos.length > 0 ? uploadedProductPhotos : ['https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600'];

        const btn = document.getElementById('save-prod-btn');
        btn.disabled = true; btn.innerText = '⏳ Сохранение в облако...';

        if (editId) {
            const idx = products.findIndex(x => String(x.id) === String(editId));
            if (idx !== -1) {
                products[idx] = {
                    ...products[idx], gender, brand, title, priceUSD, oldPriceUSD, images,
                    sizes: parsedSizes.length ? parsedSizes : [{ size: "41", cm: "26 см" }],
                    sizeChartImg: uploadedChartPhoto,
                    variants: uploadedVariants.length ? uploadedVariants : [{ name: "Основной", img: images[0] }],
                    desc
                };
            }
        } else {
            const newProd = {
                id: Date.now(),
                code: 'S-' + Math.floor(100000 + Math.random() * 900000),
                gender, brand, title, priceUSD, oldPriceUSD, images,
                sizes: parsedSizes.length ? parsedSizes : [{ size: "41", cm: "26 см" }],
                sizeChartImg: uploadedChartPhoto,
                variants: uploadedVariants.length ? uploadedVariants : [{ name: "Основной", img: images[0] }],
                desc
            };
            products.unshift(newProd);
        }

        localStorage.setItem('bw_sneaker_catalog_v11', JSON.stringify(products));
        renderCatalog();
        renderAdminProductList();

        const success = await syncCatalogToGitHub();
        btn.disabled = false;
        resetAdminForm();
        if (success) alert('✅ Успешно! Товар опубликован для всех пользователей.');
    }

    function submitOrder() {
        const name = document.getElementById('ord-name').value.trim();
        const phone = document.getElementById('ord-phone').value.trim();
        const delivery = document.getElementById('ord-delivery').value;
        const city = document.getElementById('ord-city').value.trim();
        const branch = document.getElementById('ord-branch').value.trim();
        const payment = document.getElementById('ord-pay').value;
        const currency = document.getElementById('currency').value;

        if (!name || !phone || !city || !branch) { alert('Заполните обязательные поля доставки!'); return; }
        const totalUSD = Math.round(cart.reduce((s, i) => s + Number(i.priceUSD), 0));

        tg.sendData(JSON.stringify({
            action: 'new_order',
            name, phone, delivery, city, branch, payment, currency,
            total_usd: totalUSD, total_converted: formatMoney(totalUSD),
            items: cart.map(i => `${i.title} | Цвет: ${i.color} | Размер: ${i.size} (${i.cm})`)
        }));
    }

    if (isOwner) { unlockAdminUI(); }
    loadSharedCatalog();
</script>
</body>
</html>
