<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TÉNÉBRIS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050505;
            --surface: #0d0d0d;
            --surface-2: #151515;
            --text: #f5f5f5;
            --subtext: #7a7a7a;
            --border: #262626;
            --accent: #ffffff;
            --glow: 0 0 14px rgba(255, 255, 255, 0.38);
            --glow-sm: 0 0 8px rgba(255, 255, 255, 0.25);
            --danger: #ff3b30;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 36px 36px;
            color: var(--text);
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        header {
            position: sticky; top: 0; z-index: 20;
            background: rgba(5, 5, 5, 0.88);
            backdrop-filter: blur(12px);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-box {
            display: flex; align-items: center; gap: 10px;
            font-weight: 900; font-size: 17px; letter-spacing: 3.5px;
            cursor: pointer; user-select: none; color: var(--accent);
            text-shadow: 0 0 10px rgba(255,255,255,0.45);
        }
        .logo-icon {
            border: 1.5px solid var(--accent);
            padding: 2px 6px; font-size: 13px; font-weight: 900;
            box-shadow: var(--glow-sm);
            background: rgba(255,255,255,0.04);
        }
        .currency-select {
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); padding: 6px 10px;
            font-weight: 700; font-size: 11px; outline: none;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .currency-select:focus { border-color: var(--accent); box-shadow: var(--glow-sm); }
        .search-wrap { padding: 14px 16px 6px; }
        .search-input {
            width: 100%; background: var(--surface);
            border: 1px solid var(--border); padding: 11px 16px;
            font-size: 13px; outline: none; color: var(--text);
            letter-spacing: 0.4px; transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: var(--glow-sm); }
        .search-input::placeholder { color: var(--subtext); }
        .tabs { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--surface); color: var(--subtext);
            border: 1px solid var(--border); padding: 8px 14px;
            font-size: 11px; font-weight: 700; cursor: pointer;
            white-space: nowrap; text-transform: uppercase;
            letter-spacing: 1.2px; transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--accent); color: #000;
            border-color: var(--accent); box-shadow: var(--glow);
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 16px; }
        .card {
            position: relative; border: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; cursor: pointer; background: rgba(13, 13, 13, 0.9);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card:active { border-color: var(--accent); box-shadow: var(--glow-sm); }
        .sale-badge {
            position: absolute; top: 8px; left: 8px;
            background: var(--accent); color: #000;
            font-size: 10px; font-weight: 900; padding: 3px 6px;
            text-transform: uppercase; z-index: 2;
            box-shadow: var(--glow-sm); letter-spacing: 0.5px;
        }
        .card img {
            width: 100%; height: 145px; object-fit: contain;
            background: #080808; margin-bottom: 10px;
            border: 1px solid #161616;
        }
        .card-brand { font-size: 9px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
        .card-title { font-size: 13px; font-weight: 700; margin: 4px 0 8px; line-height: 1.25; color: var(--text); }
        .price-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .old-price { font-size: 11px; color: var(--subtext); text-decoration: line-through; }
        .cur-price { font-size: 14px; font-weight: 800; color: var(--accent); text-shadow: 0 0 8px rgba(255,255,255,0.25); }
        .admin-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
        .adm-mini-btn {
            font-size: 10px; font-weight: 700; padding: 6px;
            border: 1px solid var(--border); background: var(--surface-2);
            color: var(--text); cursor: pointer; text-align: center;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .adm-mini-btn:active { border-color: var(--accent); }
        .adm-mini-btn.del { border-color: rgba(255, 59, 48, 0.5); color: var(--danger); }
        .section { display: none; }
        .section.active { display: block; }
        .detail-wrap { padding: 14px 16px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.2px; color: var(--subtext);
        }
        .back-link:hover { color: var(--accent); }
        .slider-box {
            position: relative; width: 100%; height: 290px;
            background: #080808; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid var(--border);
        }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
        .zoom-hint {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0, 0, 0, 0.75); border: 1px solid var(--border);
            color: var(--text); font-size: 10px; padding: 4px 8px;
            pointer-events: none; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .slide-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(10, 10, 10, 0.85); border: 1px solid var(--border);
            color: var(--accent); width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; user-select: none; z-index: 5;
        }
        .slide-arrow:active { border-color: var(--accent); box-shadow: var(--glow-sm); }
        .slide-arrow.left { left: 8px; } .slide-arrow.right { right: 8px; }
        .dots { display: flex; justify-content: center; gap: 6px; margin: 12px 0 16px; }
        .dot { width: 7px; height: 7px; border: 1px solid var(--subtext); background: transparent; cursor: pointer; transition: 0.2s; }
        .dot.active { background: var(--accent); border-color: var(--accent); box-shadow: var(--glow-sm); }
        .detail-title { font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; letter-spacing: 0.3px; }
        .detail-code { font-size: 11px; color: var(--subtext); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.8px; }
        .detail-prices { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
        .detail-old { font-size: 15px; color: var(--subtext); text-decoration: line-through; }
        .detail-cur { font-size: 22px; font-weight: 900; color: var(--accent); text-shadow: var(--glow-sm); }
        .sizes-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
        .size-box {
            border: 1px solid var(--border); padding: 12px 0;
            text-align: center; font-size: 13px; font-weight: 600;
            cursor: pointer; background: var(--surface); color: var(--subtext);
            transition: 0.2s;
        }
        .size-box.selected {
            border: 1.5px solid var(--accent); color: #000;
            background: var(--accent); font-weight: 900;
            box-shadow: var(--glow);
        }
        .size-chart-link {
            display: inline-block; font-size: 12px; color: var(--subtext);
            text-decoration: underline; margin-bottom: 18px; cursor: pointer;
            letter-spacing: 0.4px;
        }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
        .btn-black {
            background: var(--accent); color: #000;
            border: 1px solid var(--accent); padding: 13px 8px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.2px; cursor: pointer; text-align: center; width: 100%;
            box-shadow: var(--glow); transition: 0.2s;
        }
        .btn-black:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        .btn-outline {
            background: var(--surface); color: var(--accent);
            border: 1px solid var(--accent); padding: 13px 8px;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.2px; cursor: pointer; text-align: center; width: 100%;
        }
        .btn-outline:active { background: var(--accent); color: #000; }
        .variants-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--subtext); }
        .variants-title span { color: var(--accent); }
        .variants-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
        .var-thumb {
            width: 68px; height: 68px; border: 1px solid var(--border);
            padding: 3px; cursor: pointer; flex-shrink: 0; background: #080808;
            position: relative; transition: 0.2s;
        }
        .var-thumb.active { border: 1.5px solid var(--accent); box-shadow: var(--glow-sm); }
        .var-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .var-count-badge {
            position: absolute; bottom: 2px; right: 2px;
            background: rgba(0,0,0,0.8); color: #fff;
            font-size: 9px; font-weight: 700; padding: 1px 4px;
            border: 1px solid var(--border);
        }
        .desc-box { border-top: 1px solid var(--border); padding-top: 14px; font-size: 13px; line-height: 1.6; color: #ccc; white-space: pre-line; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px); z-index: 50; display: none;
            align-items: center; justify-content: center; padding: 16px;
        }
        .modal-card {
            background: var(--surface); width: 100%; max-width: 400px;
            padding: 18px; border: 1px solid var(--accent);
            box-shadow: var(--glow); max-height: 85vh; overflow-y: auto;
        }
        .size-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
        .size-table th, .size-table td { border: 1px solid var(--border); padding: 8px; text-align: center; color: var(--text); }
        .size-table th { background: var(--surface-2); font-weight: 700; text-transform: uppercase; }
        .pad-section { padding: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--subtext); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
            font-size: 13px; border-radius: 0; outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent); box-shadow: var(--glow-sm);
        }
        .checkbox-row {
            display: flex; align-items: center; gap: 8px; padding: 10px;
            border: 1px solid var(--border); background: var(--surface);
            margin-bottom: 12px; cursor: pointer; font-size: 12px; font-weight: 700;
        }
        .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border); padding: 12px;
            margin-bottom: 8px; background: var(--surface);
        }
        .preview-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .preview-item { position: relative; width: 58px; height: 58px; border: 1px solid var(--border); background: #080808; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-del {
            position: absolute; top: -6px; right: -6px;
            background: var(--accent); color: #000;
            width: 18px; height: 18px; font-size: 11px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(5, 5, 5, 0.94); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 14px 0; z-index: 30;
        }
        .nav-item {
            color: var(--subtext); font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active {
            color: var(--accent);
            text-shadow: var(--glow);
            text-decoration: underline; text-underline-offset: 6px;
        }
        .status-box {
            padding: 10px; margin-bottom: 12px; font-size: 11px; font-weight: 700;
            border: 1px solid var(--accent); background: rgba(255,255,255,0.06);
            color: var(--accent); display: none; letter-spacing: 0.5px;
        }
        .order-row-drag {
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border); padding: 8px 10px;
            margin-bottom: 6px; background: var(--surface-2);
        }

        /* Полноэкранный Zoom Lightbox */
        .lightbox-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.96);
            z-index: 100; display: none; flex-direction: column;
            justify-content: space-between; user-select: none;
            touch-action: none;
        }
        .lightbox-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            background: rgba(5,5,5,0.8); z-index: 2;
        }
        .lightbox-counter { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--subtext); }
        .lightbox-controls { display: flex; gap: 8px; }
        .lb-btn {
            background: var(--surface-2); color: var(--accent);
            border: 1px solid var(--border); padding: 6px 12px;
            font-size: 13px; font-weight: 800; cursor: pointer;
        }
        .lb-btn:active { border-color: var(--accent); box-shadow: var(--glow-sm); }
        .lightbox-stage {
            flex: 1; position: relative; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        .lightbox-stage img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            transition: transform 0.15s ease-out; transform-origin: center center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-box" onclick="handleLogoTap()">
        <span class="logo-icon">T</span> TÉNÉBRIS
    </div>
    <select id="currency" class="currency-select" onchange="refreshAllPrices()">
        <option value="UAH" selected>₴ UAH</option>
        <option value="USD">$ USD</option>
        <option value="RUB">₽ RUB</option>
        <option value="USDT">₮ USDT</option>
    </select>
</header>

<div id="page-catalog" class="section active">
    <div class="search-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск модели или бренда..." oninput="renderCatalog()">
    </div>
    <div class="tabs" id="gender-tabs"></div>
    <div class="tabs" id="brand-tabs"></div>
    <div id="product-grid" class="grid"></div>
</div>

<div id="page-detail" class="section">
    <div class="detail-wrap">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div class="back-link" onclick="openPage('catalog')">← Каталог</div>
            <div id="det-admin-btns" style="display:none; gap:8px;">
                <button class="adm-mini-btn" onclick="startEditProduct(activeProduct.id)">✏️ Изменить</button>
                <button class="adm-mini-btn del" onclick="deleteProduct(activeProduct.id)">🗑 Удалить</button>
            </div>
        </div>
        <div class="slider-box">
            <div class="slide-arrow left" onclick="changeSlide(-1)">‹</div>
            <img id="det-main-img" src="" alt="Product" onclick="openLightbox()">
            <div class="slide-arrow right" onclick="changeSlide(1)">›</div>
            <div class="zoom-hint">🔍 Нажми для увеличения</div>
        </div>
        <div id="det-dots" class="dots"></div>
        <div id="det-title" class="detail-title"></div>
        <div id="det-code" class="detail-code"></div>
        <div class="detail-prices">
            <span id="det-old-price" class="detail-old"></span>
            <span id="det-cur-price" class="detail-cur"></span>
        </div>
        <div id="det-sizes" class="sizes-grid"></div>
        <div class="size-chart-link" onclick="openSizeModal()">📏 Размерная сетка (см стопы)</div>
        <div class="action-row">
            <button class="btn-black" onclick="buyNowCurrent()">Быстрая покупка</button>
            <button class="btn-outline" onclick="addCurrentToCart()">В корзину</button>
        </div>
        <div id="det-variants-block" style="display:none;">
            <div class="variants-title">Цвет: <span id="det-color-name"></span></div>
            <div id="det-variants" class="variants-row"></div>
        </div>
        <div id="det-desc" class="desc-box"></div>
    </div>
</div>

<!-- Полноэкранный просмотр и зум фото -->
<div id="lightbox-modal" class="lightbox-overlay">
    <div class="lightbox-top">
        <div id="lb-counter" class="lightbox-counter">1 / 1</div>
        <div class="lightbox-controls">
            <button class="lb-btn" onclick="adjustZoom(-0.5)">−</button>
            <button class="lb-btn" onclick="adjustZoom(0.5)">+</button>
            <button class="lb-btn" onclick="closeLightbox()">✕</button>
        </div>
    </div>
    <div class="lightbox-stage" id="lb-stage">
        <div class="slide-arrow left" onclick="changeLightboxSlide(-1)">‹</div>
        <img id="lb-img" src="" alt="Zoom">
        <div class="slide-arrow right" onclick="changeLightboxSlide(1)">›</div>
    </div>
</div>

<div id="size-modal" class="modal-overlay" onclick="closeSizeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-size:13px; text-transform:uppercase; letter-spacing:1px;">📏 Размерная линейка</strong>
            <span style="cursor:pointer; font-size:18px; font-weight:bold;" onclick="closeSizeModal()">✕</span>
        </div>
        <div id="modal-size-content"></div>
        <img id="modal-size-img" src="" style="width:100%; margin-top:10px; display:none; border:1px solid var(--border);">
    </div>
</div>

<div id="page-cart" class="section pad-section">
    <h2 style="margin-bottom: 14px; font-size:16px; text-transform:uppercase; letter-spacing:2px;">Корзина</h2>
    <div id="cart-list"></div>
    <div id="cart-summary" style="margin-top: 18px; display: none;">
        <div class="form-group">
            <label>Имя и Фамилия *</label>
            <input type="text" id="ord-name" placeholder="Иван Иванов">
        </div>
        <div class="form-group">
            <label>Номер телефона *</label>
            <input type="tel" id="ord-phone" placeholder="+380...">
        </div>
        <div class="form-group">
            <label>Служба доставки *</label>
            <select id="ord-delivery">
                <option value="Новая Почта">Новая Почта</option>
                <option value="Укрпочта">Укрпочта</option>
                <option value="Самовывоз">Самовывоз</option>
            </select>
        </div>
        <div class="form-group">
            <label>Город *</label>
            <input type="text" id="ord-city" placeholder="Например: Киев">
        </div>
        <div class="form-group">
            <label>Отделение / Почтомат / Адрес *</label>
            <input type="text" id="ord-branch" placeholder="Отделение №15">
        </div>
        <div class="form-group">
            <label>Способ оплаты</label>
            <select id="ord-pay">
                <option value="Наложенный платеж (при получении)">При получении (Наложенный платеж)</option>
                <option value="Оплата на карту">Оплата на карту</option>
                <option value="USDT / CryptoBot (@send)">Криптовалюта (USDT / @send)</option>
            </select>
        </div>
        <div id="total-price" style="font-size:17px; font-weight:900; margin: 16px 0; color:var(--accent); text-shadow:var(--glow-sm);"></div>
        <button class="btn-black" onclick="submitOrder()">Оформить заказ</button>
    </div>
</div>

<div id="page-admin" class="section pad-section">
    <h2 style="margin-bottom: 12px; font-size:16px; text-transform:uppercase; letter-spacing:2px;">⚙️ Панель TÉNÉBRIS</h2>
    
    <details id="cloud-settings-box" style="border:1px solid var(--border); padding:10px; margin-bottom:16px; background:var(--surface);">
        <summary style="font-size:11px; font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:1px;">
            ☁️ Настройка облака (GitHub и ImgBB)
        </summary>
        <div style="margin-top:12px;">
            <div class="form-group">
                <label>GitHub Репозиторий</label>
                <input type="text" id="cfg-repo" placeholder="Ricard9760/shop">
            </div>
            <div class="form-group">
                <label>GitHub Token (ghp_...)</label>
                <input type="password" id="cfg-gh-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <div class="form-group">
                <label>ImgBB API Key</label>
                <input type="password" id="cfg-imgbb-key" placeholder="api.imgbb.com ключ">
            </div>
            <button class="btn-black" style="padding:10px;" onclick="saveCloudConfig()">💾 Сохранить ключи</button>
        </div>
    </details>

    <div id="admin-status" class="status-box"></div>
    
    <details style="border:1px solid var(--border); padding:10px; margin-bottom:16px; background:var(--surface);">
        <summary style="font-size:11px; font-weight:800; cursor:pointer; text-transform:uppercase; letter-spacing:1px;">
            📂 Управление категориями (Синхронизация для всех)
        </summary>
        <div style="margin-top:12px;">
            <div style="display:flex; gap:6px; margin-bottom:10px;">
                <input type="text" id="new-category-name" placeholder="Новая категория" style="padding:8px; font-size:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); flex:1;">
                <button class="btn-black" style="width:auto; padding:8px 14px; font-size:11px;" onclick="addNewCategory()">+ Добавить</button>
            </div>
            <div id="manage-categories-list"></div>
        </div>
    </details>
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="form-mode-title" style="font-size:14px; text-transform:uppercase; letter-spacing:1px;">➕ Новый товар</h3>
        <button id="cancel-edit-btn" class="adm-mini-btn" style="display:none;" onclick="resetAdminForm()">✕ Отменить</button>
    </div>
    <input type="hidden" id="adm-edit-id" value="">
    <div class="form-group">
        <label>Категория товара</label>
        <select id="adm-gender"></select>
    </div>
    <div class="form-group">
        <label>Бренд</label>
        <input type="text" id="adm-brand" placeholder="Например: Asics, Nike, Rick Owens">
    </div>
    <div class="form-group">
        <label>Название модели</label>
        <input type="text" id="adm-title" placeholder="Asics Gel NYC">
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <div class="form-group">
            <label>Цена *</label>
            <input type="number" id="adm-price" placeholder="4145">
        </div>
        <div class="form-group">
            <label>Валюта ввода</label>
            <select id="adm-cur">
                <option value="UAH">UAH (₴)</option>
                <option value="USD">USD ($)</option>
                <option value="RUB">RUB (₽)</option>
                <option value="USDT">₮ USDT</option>
            </select>
        </div>
    </div>
    <label class="checkbox-row">
        <input type="checkbox" id="adm-has-discount" onchange="toggleDiscountBox()">
        <span>🔥 Назначить скидку (старая цена)</span>
    </label>
    <div id="discount-settings" style="display:none; border:1px solid var(--border); padding:10px; margin-bottom:12px; background:var(--surface-2);">
        <div class="form-group" style="margin-bottom:0;">
            <label>Старая цена до скидки</label>
            <input type="number" id="adm-old-price" placeholder="8810">
        </div>
    </div>

    <div class="form-group">
        <label>Название основного цвета *</label>
        <input type="text" id="adm-main-color" placeholder="Например: Obsidian Black / Graphite">
    </div>
    <div class="form-group">
        <label>Фотографии основного цвета (можно несколько)</label>
        <input type="file" id="adm-photos" accept="image/*" multiple onchange="handleMultiPhotos(this)">
        <div id="adm-photo-preview" class="preview-strip"></div>
    </div>

    <div style="border:1px solid var(--border); padding:12px; margin-bottom:14px; background:var(--surface);">
        <label style="font-size:11px; font-weight:800; display:block; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.8px; color:var(--accent);">
            🎨 Дополнительные цвета (несколько фото на каждый цвет)
        </label>
        <input type="text" id="var-color-name" placeholder="Название цвета (напр. White Silver)" style="margin-bottom:8px; width:100%; padding:9px; background:var(--bg); border:1px solid var(--border); color:var(--text);">
        <input type="file" id="var-color-files" accept="image/*" multiple onchange="handleVariantDraftFiles(this)" style="margin-bottom:8px; width:100%; color:var(--subtext); font-size:12px;">
        <div id="var-temp-preview" class="preview-strip" style="margin-bottom:8px;"></div>
        <button type="button" class="btn-outline" style="padding:8px;" onclick="addVariantDraft()">+ Прикрепить этот цвет с фото</button>
        <div id="var-draft-list" class="preview-strip" style="margin-top:10px;"></div>
    </div>

    <div class="form-group">
        <label>Размеры и длина стопы в см</label>
        <textarea id="adm-sizes" rows="3">36=23см, 37=23.5см, 38=24см, 39=24.5см, 40=25см, 41=26см, 42=26.5см, 43=27.5см, 44=28см, 45=29см</textarea>
    </div>
    <div class="form-group">
        <label>Фото размерной сетки</label>
        <input type="file" id="adm-chart-file" accept="image/*" onchange="handleChartPhoto(this)">
        <div id="adm-chart-preview" class="preview-strip"></div>
    </div>
    <div class="form-group">
        <label>Описание товара</label>
        <textarea id="adm-desc" rows="3" placeholder="Материалы, особенности модели..."></textarea>
    </div>
    <button id="save-prod-btn" class="btn-black" onclick="saveNewProduct()">✅ Сохранить и опубликовать</button>
    <h3 style="margin: 24px 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:1px; border-top:1px solid var(--border); padding-top:16px;">
        📦 Управление каталогом
    </h3>
    <div id="admin-products-list"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" id="nav-catalog" onclick="openPage('catalog')">Каталог</div>
    <div class="nav-item" id="nav-cart" onclick="openPage('cart')">Корзина (<span id="cart-count">0</span>)</div>
    <div class="nav-item" id="nav-admin" style="display:none;" onclick="openPage('admin')">➕ Админ</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const tgUser = (tg.initDataUnsafe?.user?.username || "").toLowerCase();
    let isOwner = (urlParams.get('admin') === '1') || (tgUser === 'endry_sit');

    function unlockAdminUI() {
        isOwner = true;
        document.getElementById('nav-admin').style.display = 'block';
        document.getElementById('det-admin-btns').style.display = 'flex';
        initCloudSettingsForm();
        renderAdminProductList();
        renderCategoryOptions();
        renderCategoryManagerUI();
    }

    function detectGitHubRepo() {
        const saved = localStorage.getItem('cfg_gh_repo');
        if (saved) return saved;
        return 'Ricard9760/shop';
    }

    function initCloudSettingsForm() {
        document.getElementById('cfg-repo').value = detectGitHubRepo();
        document.getElementById('cfg-gh-token').value = localStorage.getItem('cfg_gh_token') || '';
        document.getElementById('cfg-imgbb-key').value = localStorage.getItem('cfg_imgbb_key') || '';
    }

    function saveCloudConfig() {
        localStorage.setItem('cfg_gh_repo', document.getElementById('cfg-repo').value.trim());
        localStorage.setItem('cfg_gh_token', document.getElementById('cfg-gh-token').value.trim());
        localStorage.setItem('cfg_imgbb_key', document.getElementById('cfg-imgbb-key').value.trim());
        alert('✅ Ключи сохранены!');
        document.getElementById('cloud-settings-box').open = false;
        loadSharedCatalog();
    }

    let logoTapCount = 0;
    let logoTapTimer = null;
    function handleLogoTap() {
        openPage('catalog');
        logoTapCount++;
        clearTimeout(logoTapTimer);
        logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 1800);
        if (logoTapCount >= 5 && !isOwner) {
            logoTapCount = 0;
            const pin = prompt("Введите PIN владельца:");
            if (pin === "7777") {
                unlockAdminUI();
                openPage('admin');
            }
        }
    }

    function toggleDiscountBox() {
        const checked = document.getElementById('adm-has-discount').checked;
        document.getElementById('discount-settings').style.display = checked ? 'block' : 'none';
        if (!checked) document.getElementById('adm-old-price').value = '';
    }

    const rates = {
        USD: { rate: 1, sym: '$' },
        USDT: { rate: 1, sym: '₮' },
        UAH: { rate: 41.5, sym: '₴' },
        RUB: { rate: 96, sym: '₽' }
    };

    let products = [];
    let customGenderOrder = ['ALL', 'Мужские', 'Женские', 'Унисекс'];
    let customBrandOrder = [];

    let selectedGender = 'ALL';
    let selectedBrand = 'ALL';

    let activeProduct = null;
    let activeSlideIdx = 0;
    let activeSize = null;
    let activeColor = "";
    let activeGallery = [];
    let cart = [];

    let uploadedProductPhotos = [];
    let uploadedChartPhoto = "";
    let tempVariantPhotos = [];
    let uploadedVariants = [];

    function applyCloudPayload(cloudData) {
        if (Array.isArray(cloudData)) {
            products = cloudData;
        } else if (cloudData && typeof cloudData === 'object') {
            if (Array.isArray(cloudData.products)) products = cloudData.products;
            if (Array.isArray(cloudData.categories) && cloudData.categories.length > 0) {
                customGenderOrder = cloudData.categories.includes('ALL')
                    ? cloudData.categories
                    : ['ALL', ...cloudData.categories];
            }
        }
    }

    async function loadSharedCatalog() {
        const repo = detectGitHubRepo();
        let loadedFromCloud = false;

        try {
            const apiUrl = `https://api.github.com/repos/${repo}/contents/products.json?t=${Date.now()}`;
            const res = await fetch(apiUrl, {
                headers: { 'Accept': 'application/vnd.github.v3.raw' },
                cache: 'no-store'
            });
            if (res && res.ok) {
                const cloudData = await res.json();
                applyCloudPayload(cloudData);
                loadedFromCloud = true;
            }
        } catch (e) {}

        if (!loadedFromCloud) {
            try {
                const rawRes = await fetch(`https://raw.githubusercontent.com/${repo}/main/products.json?t=${Date.now()}`, { cache: 'no-store' });
                if (rawRes && rawRes.ok) {
                    const cloudData = await rawRes.json();
                    applyCloudPayload(cloudData);
                    loadedFromCloud = true;
                }
            } catch (e) {}
        }

        if (!loadedFromCloud) {
            const local = localStorage.getItem('tenebris_catalog_v1');
            if (local) applyCloudPayload(JSON.parse(local));
        } else {
            localStorage.setItem('tenebris_catalog_v1', JSON.stringify({
                categories: customGenderOrder,
                products: products
            }));
        }

        if (!customGenderOrder.includes(selectedGender)) selectedGender = 'ALL';

        renderCatalog();
        if (isOwner) {
            renderAdminProductList();
            renderCategoryOptions();
            renderCategoryManagerUI();
        }
    }

    async function syncCatalogToGitHub() {
        const repo = document.getElementById('cfg-repo').value.trim() || detectGitHubRepo();
        const token = localStorage.getItem('cfg_gh_token');
        if (!token) {
            alert('⚠️ Введите GitHub Token в настройках админки, чтобы изменения сохранились у всех пользователей!');
            return false;
        }

        const statusEl = document.getElementById('admin-status');
        statusEl.style.display = 'block';
        statusEl.innerText = '⏳ Синхронизация с облаком TÉNÉBRIS...';

        const apiUrl = `https://api.github.com/repos/${repo}/contents/products.json`;
        let sha = null;

        try {
            const getRes = await fetch(apiUrl + `?t=${Date.now()}`, {
                headers: { 'Authorization': `token ${token}` },
                cache: 'no-store'
            });
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }
        } catch (e) {}

        const payloadData = {
            categories: customGenderOrder,
            products: products
        };

        localStorage.setItem('tenebris_catalog_v1', JSON.stringify(payloadData));

        const contentStr = JSON.stringify(payloadData, null, 2);
        const contentBase64 = btoa(unescape(encodeURIComponent(contentStr)));

        const bodyObj = {
            message: "Sync TÉNÉBRIS catalog & categories",
            content: contentBase64
        };
        if (sha) bodyObj.sha = sha;

        const putRes = await fetch(apiUrl, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(bodyObj)
        });

        if (putRes.ok) {
            statusEl.innerText = '✅ Синхронизировано! Изменения доступны всем пользователям.';
            setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
            return true;
        } else {
            const errJson = await putRes.json().catch(() => ({}));
            statusEl.innerText = '⚠️ Ошибка синхронизации GitHub.';
            alert('⚠️ Ошибка GitHub: ' + (errJson.message || putRes.statusText));
            return false;
        }
    }

    function formatMoney(usd) {
        if (!usd || usd <= 0) return "";
        const cur = document.getElementById('currency').value;
        const val = Math.round(usd * rates[cur].rate);
        return `${val} ${rates[cur].sym}`;
    }

    function refreshAllPrices() {
        renderCatalog();
        if (activeProduct) openProductDetail(activeProduct.id, false);
        renderCart();
        if (isOwner) renderAdminProductList();
    }

    function renderGenderTabs() {
        const wrap = document.getElementById('gender-tabs');
        wrap.innerHTML = customGenderOrder.map(g => {
            const label = g === 'ALL' ? 'Все' : g;
            return `<button class="tab-btn ${selectedGender === g ? 'active' : ''}" onclick="setGender('${g}')">${label}</button>`;
        }).join('');
    }

    function renderCategoryOptions() {
        const select = document.getElementById('adm-gender');
        const cats = customGenderOrder.filter(c => c !== 'ALL');
        select.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderCategoryManagerUI() {
        const wrap = document.getElementById('manage-categories-list');
        const cats = customGenderOrder.filter(c => c !== 'ALL');
        wrap.innerHTML = cats.map(cat => `
            <div class="order-row-drag">
                <span style="font-size:12px; font-weight:700;">${cat}</span>
                <button class="adm-mini-btn del" onclick="removeCategory('${cat}')">🗑 Удалить</button>
            </div>
        `).join('');
    }

    async function addNewCategory() {
        const input = document.getElementById('new-category-name');
        const name = input.value.trim();
        if (!name) return;
        if (customGenderOrder.includes(name)) { alert('Такая категория уже есть!'); return; }
        customGenderOrder.push(name);
        input.value = '';
        renderGenderTabs();
        renderCategoryOptions();
        renderCategoryManagerUI();
        await syncCatalogToGitHub();
    }

    async function removeCategory(catName) {
        if (customGenderOrder.filter(c => c !== 'ALL').length <= 1) {
            alert('Нельзя удалить последнюю категорию!');
            return;
        }
        if (!confirm(`Удалить категорию «${catName}» у всех пользователей?`)) return;
        const fallbackCat = customGenderOrder.find(c => c !== 'ALL' && c !== catName);
        products.forEach(p => { if (p.gender === catName) p.gender = fallbackCat; });
        customGenderOrder = customGenderOrder.filter(c => c !== catName);
        if (selectedGender === catName) selectedGender = 'ALL';
        renderGenderTabs();
        renderCategoryOptions();
        renderCategoryManagerUI();
        renderCatalog();
        await syncCatalogToGitHub();
    }

    function renderBrandTabs() {
        const wrap = document.getElementById('brand-tabs');
        const existingBrands = [...new Set(products.map(p => p.brand))];
        existingBrands.forEach(b => { if (!customBrandOrder.includes(b)) customBrandOrder.push(b); });
        customBrandOrder = customBrandOrder.filter(b => existingBrands.includes(b));
        const fullBrands = ['ALL', ...customBrandOrder];
        wrap.innerHTML = fullBrands.map(b => `
            <button class="tab-btn ${selectedBrand === b ? 'active' : ''}" onclick="setBrand('${b}')">
                ${b === 'ALL' ? 'Все бренды' : b}
            </button>
        `).join('');
    }

    function setGender(g) { selectedGender = g; renderGenderTabs(); renderCatalog(); }
    function setBrand(b) { selectedBrand = b; renderBrandTabs(); renderCatalog(); }

    function renderCatalog() {
        renderGenderTabs();
        renderBrandTabs();
        const q = document.getElementById('search-input').value.toLowerCase().trim();
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        const filtered = products.filter(p => {
            const matchG = selectedGender === 'ALL' || p.gender === selectedGender;
            const matchB = selectedBrand === 'ALL' || p.brand.toLowerCase() === selectedBrand.toLowerCase();
            const matchQ = !q || p.title.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q);
            return matchG && matchB && matchQ;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; padding: 40px 10px; color:var(--subtext); font-size:12px; letter-spacing:1px; text-transform:uppercase;">В каталоге пока нет товаров</p>';
            return;
        }

        filtered.forEach(p => {
            const hasDiscount = p.oldPriceUSD && p.oldPriceUSD > p.priceUSD;
            const oldHtml = hasDiscount ? `<span class="old-price">${formatMoney(p.oldPriceUSD)}</span>` : '';
            const perc = hasDiscount ? Math.round((1 - p.priceUSD / p.oldPriceUSD) * 100) : 0;
            const badgeHtml = hasDiscount ? `<div class="sale-badge">-${perc}%</div>` : '';

            const adminBtnsHtml = isOwner ? `
                <div class="admin-card-actions" onclick="event.stopPropagation()">
                    <button class="adm-mini-btn" onclick="startEditProduct(${p.id})">✏️ Изм.</button>
                    <button class="adm-mini-btn del" onclick="deleteProduct(${p.id})">🗑 Удал.</button>
                </div>
            ` : '';

            const coverImg = (p.images && p.images[0]) || (p.variants && p.variants[0]?.images?.[0]) || '';

            grid.innerHTML += `
                <div class="card" onclick="openProductDetail(${p.id}, true)">
                    ${badgeHtml}
                    <div>
                        <img src="${coverImg}" alt="${p.title}">
                        <div class="card-brand">${p.brand} • ${p.gender}</div>
                        <div class="card-title">${p.title}</div>
                    </div>
                    <div>
                        <div class="price-row">${oldHtml}<span class="cur-price">${formatMoney(p.priceUSD)}</span></div>
                        ${adminBtnsHtml}
                    </div>
                </div>
            `;
        });
    }

    function renderAdminProductList() {
        const wrap = document.getElementById('admin-products-list');
        if (!wrap) return;
        if (products.length === 0) { wrap.innerHTML = '<p style="font-size:12px; color:var(--subtext);">В каталоге пока нет товаров.</p>'; return; }
        wrap.innerHTML = products.map(p => `
            <div class="cart-item">
                <div style="display:flex; align-items:center; gap:10px;">
                    <img src="${p.images[0]}" style="width:46px; height:46px; object-fit:contain; border:1px solid var(--border); background:#080808;">
                    <div>
                        <div style="font-size:10px; color:var(--subtext); text-transform:uppercase;">${p.gender} • ${p.brand}</div>
                        <div style="font-weight:700; font-size:13px;">${p.title}</div>
                        <div style="font-weight:800; font-size:12px; color:var(--accent);">${formatMoney(p.priceUSD)}</div>
                    </div>
                </div>
                <div style="display:flex; gap:6px;">
                    <button class="adm-mini-btn" onclick="startEditProduct(${p.id})">✏️</button>
                    <button class="adm-mini-btn del" onclick="deleteProduct(${p.id})">🗑</button>
                </div>
            </div>
        `).join('');
    }

    function normalizeVariants(p) {
        const rawVars = p.variants || [];
        if (rawVars.length === 0) {
            return [{
                name: p.mainColor || "Black",
                images: p.images && p.images.length ? p.images : []
            }];
        }
        return rawVars.map(v => ({
            name: v.name || "Black",
            images: Array.isArray(v.images) && v.images.length ? v.images : (v.img ? [v.img] : p.images)
        }));
    }

    function startEditProduct(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        openPage('admin');
        document.getElementById('form-mode-title').innerText = `✏️ Редактирование: ${p.title}`;
        document.getElementById('cancel-edit-btn').style.display = 'inline-block';
        document.getElementById('save-prod-btn').innerText = '💾 Сохранить изменения';
        document.getElementById('adm-edit-id').value = p.id;
        document.getElementById('adm-gender').value = p.gender || customGenderOrder[1] || 'Мужские';
        document.getElementById('adm-brand').value = p.brand || '';
        document.getElementById('adm-title').value = p.title || '';
        const cur = document.getElementById('adm-cur').value;
        document.getElementById('adm-price').value = Math.round(p.priceUSD * rates[cur].rate);
        const hasDisc = p.oldPriceUSD && p.oldPriceUSD > p.priceUSD;
        document.getElementById('adm-has-discount').checked = !!hasDisc;
        toggleDiscountBox();
        if (hasDisc) document.getElementById('adm-old-price').value = Math.round(p.oldPriceUSD * rates[cur].rate);

        const normVars = normalizeVariants(p);
        document.getElementById('adm-main-color').value = p.mainColor || normVars[0].name || '';
        uploadedProductPhotos = [...(normVars[0].images || p.images || [])];
        renderPhotoPreviews();

        uploadedVariants = normVars.slice(1);
        renderVariantPreviews();

        uploadedChartPhoto = p.sizeChartImg || "";
        renderChartPreview();
        document.getElementById('adm-sizes').value = (p.sizes || []).map(s => `${s.size}=${s.cm}`).join(', ');
        document.getElementById('adm-desc').value = p.desc || '';
        window.scrollTo(0, 0);
    }

    function resetAdminForm() {
        document.getElementById('form-mode-title').innerText = '➕ Новый товар';
        document.getElementById('cancel-edit-btn').style.display = 'none';
        document.getElementById('save-prod-btn').innerText = '✅ Сохранить и опубликовать';
        document.getElementById('adm-edit-id').value = '';
        document.getElementById('adm-brand').value = '';
        document.getElementById('adm-title').value = '';
        document.getElementById('adm-price').value = '';
        document.getElementById('adm-main-color').value = '';
        document.getElementById('adm-has-discount').checked = false;
        toggleDiscountBox();
        document.getElementById('adm-desc').value = '';
        uploadedProductPhotos = [];
        uploadedChartPhoto = "";
        tempVariantPhotos = [];
        uploadedVariants = [];
        renderPhotoPreviews();
        renderChartPreview();
        renderTempVariantPreviews();
        renderVariantPreviews();
    }

    async function deleteProduct(id) {
        if (!isOwner) return;
        const p = products.find(x => x.id === id);
        if (!p) return;
        if (!confirm(`Удалить товар «${p.title}» навсегда?`)) return;

        products = products.filter(x => x.id !== id);
        renderCatalog();
        renderAdminProductList();
        if (activeProduct && activeProduct.id === id) openPage('catalog');

        await syncCatalogToGitHub();
    }

    function openProductDetail(id, resetState = true) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        activeProduct = p;
        const normVars = normalizeVariants(p);

        if (resetState) {
            activeSlideIdx = 0;
            activeSize = p.sizes && p.sizes.length ? p.sizes[0].size : "41";
            activeColor = normVars[0].name;
            activeGallery = normVars[0].images && normVars[0].images.length ? normVars[0].images : p.images;
        }
        document.getElementById('det-title').innerText = p.title;
        document.getElementById('det-code').innerText = `КОД: ${p.code || 'T-' + p.id}  |  ${p.gender}`;
        const hasDiscount = p.oldPriceUSD && p.oldPriceUSD > p.priceUSD;
        const oldEl = document.getElementById('det-old-price');
        if (hasDiscount) { oldEl.innerText = formatMoney(p.oldPriceUSD); oldEl.style.display = 'inline'; }
        else { oldEl.innerText = ''; oldEl.style.display = 'none'; }
        document.getElementById('det-cur-price').innerText = formatMoney(p.priceUSD);
        document.getElementById('det-desc').innerText = p.desc || "Описание отсутствует.";
        updateSliderView();
        renderDetailSizes();
        renderDetailVariants();
        openPage('detail');
    }

    function updateSliderView() {
        const imgs = activeGallery && activeGallery.length ? activeGallery : activeProduct.images;
        document.getElementById('det-main-img').src = imgs[activeSlideIdx] || imgs[0];
        const dotsWrap = document.getElementById('det-dots');
        dotsWrap.innerHTML = imgs.map((_, i) => `<span class="dot ${i === activeSlideIdx ? 'active' : ''}" onclick="setSlide(${i})"></span>`).join('');
    }

    function changeSlide(dir) {
        const imgs = activeGallery && activeGallery.length ? activeGallery : activeProduct.images;
        const len = imgs.length;
        if (!len) return;
        activeSlideIdx = (activeSlideIdx + dir + len) % len;
        updateSliderView();
    }

    function setSlide(i) { activeSlideIdx = i; updateSliderView(); }

    function renderDetailSizes() {
        const wrap = document.getElementById('det-sizes');
        wrap.innerHTML = (activeProduct.sizes || []).map(s => `<div class="size-box ${activeSize === s.size ? 'selected' : ''}" onclick="chooseDetailSize('${s.size}')">${s.size}</div>`).join('');
    }

    function chooseDetailSize(sz) { activeSize = sz; renderDetailSizes(); }

    function renderDetailVariants() {
        const block = document.getElementById('det-variants-block');
        const row = document.getElementById('det-variants');
        const vars = normalizeVariants(activeProduct);
        if (vars.length === 0) { block.style.display = 'none'; return; }
        block.style.display = 'block';
        document.getElementById('det-color-name').innerText = activeColor;
        row.innerHTML = vars.map((v, idx) => {
            const cover = v.images[0] || '';
            const countBadge = v.images.length > 1 ? `<span class="var-count-badge">${v.images.length} фото</span>` : '';
            return `
                <div class="var-thumb ${activeColor === v.name ? 'active' : ''}" onclick="chooseColorVariant(${idx})">
                    <img src="${cover}" alt="${v.name}">
                    ${countBadge}
                </div>
            `;
        }).join('');
    }

    function chooseColorVariant(idx) {
        const vars = normalizeVariants(activeProduct);
        const chosen = vars[idx];
        if (!chosen) return;
        activeColor = chosen.name;
        activeGallery = chosen.images && chosen.images.length ? chosen.images : activeProduct.images;
        activeSlideIdx = 0;
        updateSliderView();
        renderDetailVariants();
    }

    /* Полноэкранный Zoom Lightbox */
    let currentZoom = 1;
    let panX = 0, panY = 0;
    let startTouchX = 0, startTouchY = 0;
    let isDraggingImg = false;
    let initialPinchDist = null;
    let lastTapTime = 0;

    function openLightbox() {
        if (!activeProduct) return;
        currentZoom = 1; panX = 0; panY = 0;
        updateLightboxImage();
        document.getElementById('lightbox-modal').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox-modal').style.display = 'none';
    }

    function updateLightboxImage() {
        const imgs = activeGallery && activeGallery.length ? activeGallery : activeProduct.images;
        const imgEl = document.getElementById('lb-img');
        imgEl.src = imgs[activeSlideIdx] || imgs[0];
        imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
        document.getElementById('lb-counter').innerText = `${activeSlideIdx + 1} / ${imgs.length}`;
    }

    function changeLightboxSlide(dir) {
        currentZoom = 1; panX = 0; panY = 0;
        changeSlide(dir);
        updateLightboxImage();
    }

    function adjustZoom(delta) {
        currentZoom = Math.min(4, Math.max(1, currentZoom + delta));
        if (currentZoom === 1) { panX = 0; panY = 0; }
        const imgEl = document.getElementById('lb-img');
        imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    }

    const lbStage = document.getElementById('lb-stage');
    lbStage.addEventListener('touchstart', (e) => {
        const now = Date.now();
        if (e.touches.length === 1 && now - lastTapTime < 280) {
            currentZoom = currentZoom > 1 ? 1 : 2.4;
            panX = 0; panY = 0;
            updateLightboxImage();
            lastTapTime = 0;
            return;
        }
        if (e.touches.length === 1) {
            lastTapTime = now;
            if (currentZoom > 1) {
                isDraggingImg = true;
                startTouchX = e.touches[0].clientX - panX;
                startTouchY = e.touches[0].clientY - panY;
            }
        } else if (e.touches.length === 2) {
            isDraggingImg = false;
            initialPinchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    }, { passive: true });

    lbStage.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist) {
            const dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const factor = dist / initialPinchDist;
            currentZoom = Math.min(4, Math.max(1, currentZoom * factor));
            initialPinchDist = dist;
            if (currentZoom === 1) { panX = 0; panY = 0; }
            const imgEl = document.getElementById('lb-img');
            imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
        } else if (e.touches.length === 1 && isDraggingImg && currentZoom > 1) {
            panX = e.touches[0].clientX - startTouchX;
            panY = e.touches[0].clientY - startTouchY;
            const imgEl = document.getElementById('lb-img');
            imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
        }
    }, { passive: true });

    lbStage.addEventListener('touchend', () => {
        isDraggingImg = false;
        initialPinchDist = null;
    });

    function openSizeModal() {
        if (!activeProduct) return;
        const rows = (activeProduct.sizes || []).map(s => `<tr><td><b>${s.size}</b></td><td>${s.cm || '-'}</td></tr>`).join('');
        document.getElementById('modal-size-content').innerHTML = `
            <p style="font-size:12px; color:var(--subtext); margin-bottom:8px;">Модель: <b style="color:var(--text);">${activeProduct.title}</b></p>
            <table class="size-table"><thead><tr><th>Размер</th><th>Стопа (см)</th></tr></thead><tbody>${rows}</tbody></table>
        `;
        const chartImg = document.getElementById('modal-size-img');
        if (activeProduct.sizeChartImg) { chartImg.src = activeProduct.sizeChartImg; chartImg.style.display = 'block'; }
        else { chartImg.style.display = 'none'; }
        document.getElementById('size-modal').style.display = 'flex';
    }

    function closeSizeModal() { document.getElementById('size-modal').style.display = 'none'; }

    function addCurrentToCart() {
        if (!activeProduct) return;
        const sizeObj = (activeProduct.sizes || []).find(s => s.size === activeSize) || { size: activeSize, cm: '' };
        cart.push({ id: activeProduct.id, title: activeProduct.title, brand: activeProduct.brand, priceUSD: activeProduct.priceUSD, size: sizeObj.size, cm: sizeObj.cm, color: activeColor });
        document.getElementById('cart-count').innerText = cart.length;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        alert(`Добавлено в корзину: ${activeProduct.title} (${activeColor}, р. ${sizeObj.size})`);
    }

    function buyNowCurrent() { addCurrentToCart(); openPage('cart'); }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const sumBlock = document.getElementById('cart-summary');
        list.innerHTML = '';
        if (cart.length === 0) { list.innerHTML = '<p style="color:var(--subtext); font-size:13px;">Ваша корзина пуста.</p>'; sumBlock.style.display = 'none'; return; }
        sumBlock.style.display = 'block';
        let totalUSD = 0;
        cart.forEach((item, i) => {
            totalUSD += Number(item.priceUSD);
            list.innerHTML += `
                <div class="cart-item">
                    <div>
                        <div style="font-weight:700; font-size:13px;">${item.title}</div>
                        <div style="font-size:11px; color:var(--subtext); margin-top:2px;">Размер: <b style="color:var(--text);">${item.size}</b> (${item.cm}) | Цвет: <b style="color:var(--text);">${item.color}</b></div>
                        <div style="font-weight:800; font-size:13px; margin-top:4px; color:var(--accent);">${formatMoney(item.priceUSD)}</div>
                    </div>
                    <span style="cursor:pointer; font-weight:bold; padding:6px; color:var(--subtext);" onclick="removeCartItem(${i})">✕</span>
                </div>
            `;
        });
        document.getElementById('total-price').innerText = `К ОПЛАТЕ: ${formatMoney(totalUSD)} ($${Math.round(totalUSD)})`;
    }

    function removeCartItem(i) { cart.splice(i, 1); document.getElementById('cart-count').innerText = cart.length; renderCart(); }

    function openPage(page) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navEl = document.getElementById('nav-' + page);
        if (navEl) navEl.classList.add('active');
        if (page === 'cart') renderCart();
        if (page === 'admin') { renderAdminProductList(); renderCategoryManagerUI(); renderCategoryOptions(); }
        window.scrollTo(0, 0);
    }

    function compressImageFile(file, maxWidth = 800, quality = 0.78) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(1, maxWidth / img.width);
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function uploadImageSmart(file, maxWidth = 800) {
        const dataUrl = await compressImageFile(file, maxWidth, 0.78);
        const imgbbKey = localStorage.getItem('cfg_imgbb_key');
        if (!imgbbKey) return dataUrl;
        try {
            const base64Clean = dataUrl.split(',')[1];
            const formData = new FormData();
            formData.append('image', base64Clean);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: 'POST', body: formData });
            const json = await res.json();
            if (json.success && json.data && json.data.url) return json.data.url;
        } catch (err) {}
        return dataUrl;
    }

    function renderPhotoPreviews() {
        const preview = document.getElementById('adm-photo-preview');
        preview.innerHTML = uploadedProductPhotos.map((url, idx) => `
            <div class="preview-item"><img src="${url}"><div class="preview-del" onclick="removeUploadedPhoto(${idx})">✕</div></div>
        `).join('');
    }

    function removeUploadedPhoto(idx) { uploadedProductPhotos.splice(idx, 1); renderPhotoPreviews(); }

    async function handleMultiPhotos(input) {
        const statusEl = document.getElementById('admin-status');
        statusEl.style.display = 'block'; statusEl.innerText = '⏳ Загрузка фото основного цвета...';
        for (const file of input.files) {
            const url = await uploadImageSmart(file, 800);
            uploadedProductPhotos.push(url);
            renderPhotoPreviews();
        }
        statusEl.style.display = 'none'; input.value = '';
    }

    function renderChartPreview() {
        const wrap = document.getElementById('adm-chart-preview');
        if (!uploadedChartPhoto) { wrap.innerHTML = ''; return; }
        wrap.innerHTML = `<div class="preview-item"><img src="${uploadedChartPhoto}"><div class="preview-del" onclick="uploadedChartPhoto=''; renderChartPreview();">✕</div></div>`;
    }

    async function handleChartPhoto(input) {
        if (input.files[0]) {
            uploadedChartPhoto = await uploadImageSmart(input.files[0], 800);
            renderChartPreview();
        }
    }

    /* Мульти-фото для каждого дополнительного цвета */
    function renderTempVariantPreviews() {
        const wrap = document.getElementById('var-temp-preview');
        wrap.innerHTML = tempVariantPhotos.map((url, idx) => `
            <div class="preview-item"><img src="${url}"><div class="preview-del" onclick="tempVariantPhotos.splice(${idx},1); renderTempVariantPreviews();">✕</div></div>
        `).join('');
    }

    async function handleVariantDraftFiles(input) {
        const statusEl = document.getElementById('admin-status');
        statusEl.style.display = 'block'; statusEl.innerText = '⏳ Загрузка фото для цвета...';
        for (const file of input.files) {
            const url = await uploadImageSmart(file, 800);
            tempVariantPhotos.push(url);
            renderTempVariantPreviews();
        }
        statusEl.style.display = 'none';
        input.value = '';
    }

    function renderVariantPreviews() {
        document.getElementById('var-draft-list').innerHTML = uploadedVariants.map((v, idx) => {
            const imgs = v.images || (v.img ? [v.img] : []);
            return `
                <div class="preview-item" style="width:74px; height:auto; text-align:center; font-size:9px; padding:3px;">
                    <img src="${imgs[0] || ''}" style="height:48px; object-fit:contain;">
                    <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; color:var(--text);">${v.name} (${imgs.length})</div>
                    <div class="preview-del" onclick="uploadedVariants.splice(${idx},1); renderVariantPreviews();">✕</div>
                </div>
            `;
        }).join('');
    }

    function addVariantDraft() {
        const name = document.getElementById('var-color-name').value.trim();
        if (!name || tempVariantPhotos.length === 0) {
            alert('Укажите название цвета и выберите хотя бы 1 фото!');
            return;
        }
        uploadedVariants.push({ name, images: [...tempVariantPhotos] });
        document.getElementById('var-color-name').value = '';
        tempVariantPhotos = [];
        renderTempVariantPreviews();
        renderVariantPreviews();
    }

    async function saveNewProduct() {
        if (!isOwner) return;
        const editId = document.getElementById('adm-edit-id').value;
        const gender = document.getElementById('adm-gender').value;
        const brand = document.getElementById('adm-brand').value.trim() || 'TÉNÉBRIS';
        const title = document.getElementById('adm-title').value.trim();
        const mainColor = document.getElementById('adm-main-color').value.trim() || 'Black';
        const rawPrice = Number(document.getElementById('adm-price').value);
        const hasDiscount = document.getElementById('adm-has-discount').checked;
        const rawOldPrice = hasDiscount ? Number(document.getElementById('adm-old-price').value) : 0;
        const inputCur = document.getElementById('adm-cur').value;
        const rawSizes = document.getElementById('adm-sizes').value.trim();
        const desc = document.getElementById('adm-desc').value.trim();

        if (!title || !rawPrice) { alert('Заполните название модели и цену!'); return; }

        const priceUSD = +(rawPrice / rates[inputCur].rate).toFixed(2);
        const oldPriceUSD = (hasDiscount && rawOldPrice > 0) ? +(rawOldPrice / rates[inputCur].rate).toFixed(2) : 0;

        const parsedSizes = rawSizes.split(/[,;\n]+/).map(part => {
            const [sz, cm] = part.split('=').map(s => s ? s.trim() : '');
            return sz ? { size: sz, cm: cm || '' } : null;
        }).filter(Boolean);

        const images = uploadedProductPhotos.length > 0 ? uploadedProductPhotos : ['https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600'];

        const fullVariants = [
            { name: mainColor, images: images },
            ...uploadedVariants
        ];

        const btn = document.getElementById('save-prod-btn');
        btn.disabled = true; btn.innerText = '⏳ Публикация...';

        if (editId) {
            const idx = products.findIndex(x => String(x.id) === String(editId));
            if (idx !== -1) {
                products[idx] = {
                    ...products[idx], gender, brand, title, mainColor, priceUSD, oldPriceUSD, images,
                    sizes: parsedSizes.length ? parsedSizes : [{ size: "41", cm: "26 см" }],
                    sizeChartImg: uploadedChartPhoto,
                    variants: fullVariants,
                    desc
                };
            }
        } else {
            const newProd = {
                id: Date.now(),
                code: 'T-' + Math.floor(100000 + Math.random() * 900000),
                gender, brand, title, mainColor, priceUSD, oldPriceUSD, images,
                sizes: parsedSizes.length ? parsedSizes : [{ size: "41", cm: "26 см" }],
                sizeChartImg: uploadedChartPhoto,
                variants: fullVariants,
                desc
            };
            products.unshift(newProd);
        }

        renderCatalog();
        renderAdminProductList();

        const success = await syncCatalogToGitHub();
        btn.disabled = false;
        resetAdminForm();
        if (success) alert('✅ Опубликовано в TÉNÉBRIS!');
    }

    function submitOrder() {
        const name = document.getElementById('ord-name').value.trim();
        const phone = document.getElementById('ord-phone').value.trim();
        const delivery = document.getElementById('ord-delivery').value;
        const city = document.getElementById('ord-city').value.trim();
        const branch = document.getElementById('ord-branch').value.trim();
        const payment = document.getElementById('ord-pay').value;
        const currency = document.getElementById('currency').value;

        if (!name || !phone || !city || !branch) { alert('Заполните обязательные поля доставки!'); return; }
        const totalUSD = Math.round(cart.reduce((s, i) => s + Number(i.priceUSD), 0));

        tg.sendData(JSON.stringify({
            action: 'new_order',
            name, phone, delivery, city, branch, payment, currency,
            total_usd: totalUSD, total_converted: formatMoney(totalUSD),
            items: cart.map(i => `${i.title} | Цвет: ${i.color} | Размер: ${i.size} (${i.cm})`)
        }));
    }

    if (isOwner) { unlockAdminUI(); }
    loadSharedCatalog();
</script>
