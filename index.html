<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNEAKERS TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f5f5f5;
            --text: #111111;
            --subtext: #777777;
            --border: #e0e0e0;
            --black: #000000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 85px; -webkit-tap-highlight-color: transparent; }

        header {
            position: sticky; top: 0; z-index: 20;
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-box { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 17px; letter-spacing: 2.5px; cursor: pointer; user-select: none; }
        .logo-icon { border: 2px solid var(--black); padding: 2px 5px; font-size: 13px; font-weight: 900; }
        .currency-select {
            background: var(--bg); color: var(--text); border: 1px solid var(--black);
            padding: 5px 8px; font-weight: 700; font-size: 12px; outline: none; text-transform: uppercase;
        }

        .search-wrap { padding: 12px 16px 6px; }
        .search-input {
            width: 100%; background: var(--surface); border: none; border-radius: 20px;
            padding: 10px 16px; font-size: 14px; outline: none; color: var(--text);
        }
        .tabs { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; text-transform: uppercase;
        }
        .tab-btn.active { background: var(--black); color: #fff; border-color: var(--black); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px; }
        .card {
            position: relative; border: 1px solid var(--border); display: flex; flex-direction: column;
            justify-content: space-between; padding: 10px; cursor: pointer; background: var(--bg);
        }
        .sale-badge {
            position: absolute; top: 8px; left: 8px; background: var(--black); color: #fff;
            font-size: 10px; font-weight: 800; padding: 3px 6px; text-transform: uppercase;
        }
        .card img { width: 100%; height: 140px; object-fit: contain; background: #fafafa; margin-bottom: 8px; }
        .card-brand { font-size: 10px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; }
        .card-title { font-size: 13px; font-weight: 700; margin: 3px 0 6px; line-height: 1.25; }
        .price-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .old-price { font-size: 12px; color: #999; text-decoration: line-through; }
        .cur-price { font-size: 14px; font-weight: 800; color: var(--black); }

        .section { display: none; }
        .section.active { display: block; }
        .detail-wrap { padding: 12px 16px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 12px; cursor: pointer; text-transform: uppercase; }
        
        .slider-box { position: relative; width: 100%; height: 270px; background: #fafafa; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; }
        .slide-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.85); border: 1px solid var(--border);
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; user-select: none;
        }
        .slide-arrow.left { left: 8px; }
        .slide-arrow.right { right: 8px; }
        .dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0 14px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--black); background: transparent; cursor: pointer; }
        .dot.active { background: var(--black); }

        .detail-title { font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
        .detail-code { font-size: 12px; color: var(--subtext); margin-bottom: 12px; }
        .detail-prices { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
        .detail-old { font-size: 16px; color: #999; text-decoration: line-through; }
        .detail-cur { font-size: 20px; font-weight: 800; }

        .sizes-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
        .size-box {
            border: 1px solid var(--border); padding: 12px 0; text-align: center;
            font-size: 14px; font-weight: 600; cursor: pointer; background: var(--bg);
        }
        .size-box.selected { border: 2px solid var(--black); font-weight: 800; }

        .size-chart-link {
            display: inline-block; font-size: 13px; color: var(--subtext);
            text-decoration: underline; margin-bottom: 18px; cursor: pointer;
        }

        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
        .btn-black {
            background: var(--black); color: #fff; border: 1px solid var(--black);
            padding: 13px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; cursor: pointer; text-align: center; width: 100%;
        }
        .btn-outline {
            background: var(--bg); color: var(--black); border: 1px solid var(--black);
            padding: 13px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; cursor: pointer; text-align: center; width: 100%;
        }

        .variants-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
        .variants-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
        .var-thumb {
            width: 64px; height: 64px; border: 1px solid var(--border); padding: 3px;
            cursor: pointer; flex-shrink: 0; background: #fafafa;
        }
        .var-thumb.active { border: 2px solid var(--black); }
        .var-thumb img { width: 100%; height: 100%; object-fit: contain; }

        .desc-box { border-top: 1px solid var(--border); padding-top: 14px; font-size: 14px; line-height: 1.5; color: #333; white-space: pre-line; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50;
            display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-card {
            background: var(--bg); width: 100%; max-width: 400px; padding: 18px;
            border: 1px solid var(--black); max-height: 85vh; overflow-y: auto;
        }
        .size-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
        .size-table th, .size-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        .size-table th { background: var(--surface); font-weight: 700; }

        .pad-section { padding: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid var(--black); background: var(--bg);
            color: var(--text); font-size: 14px; border-radius: 0; outline: none;
        }
        .checkbox-row {
            display: flex; align-items: center; gap: 8px; padding: 10px;
            border: 1px solid var(--black); background: var(--surface); margin-bottom: 12px; cursor: pointer;
            font-size: 13px; font-weight: 700;
        }
        .checkbox-row input { width: 18px; height: 18px; accent-color: var(--black); }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border); padding: 10px; margin-bottom: 8px;
        }
        .preview-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .preview-strip img { width: 48px; height: 48px; object-fit: cover; border: 1px solid var(--border); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 30;
        }
        .nav-item { color: var(--subtext); font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .nav-item.active { color: var(--black); text-decoration: underline; text-underline-offset: 4px; }
    </style>
</head>
<body>

<header>
    <div class="logo-box" onclick="handleLogoTap()">
        <span class="logo-icon">S</span> SNEAKERS
    </div>
    <select id="currency" class="currency-select" onchange="refreshAllPrices()">
        <option value="UAH" selected>₴ UAH</option>
        <option value="USD">$ USD</option>
        <option value="RUB">₽ RUB</option>
        <option value="USDT">₮ USDT</option>
    </select>
</header>

<!-- 1. КАТАЛОГ -->
<div id="page-catalog" class="section active">
    <div class="search-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск модели или бренда..." oninput="renderCatalog()">
    </div>
    <div class="tabs" id="gender-tabs">
        <button class="tab-btn active" onclick="setGender('ALL', this)">Все</button>
        <button class="tab-btn" onclick="setGender('Мужские', this)">Мужские</button>
        <button class="tab-btn" onclick="setGender('Женские', this)">Женские</button>
        <button class="tab-btn" onclick="setGender('Унисекс', this)">Унисекс</button>
    </div>
    <div class="tabs" id="brand-tabs"></div>
    <div id="product-grid" class="grid"></div>
</div>

<!-- 2. ДЕТАЛЬНАЯ СТРАНИЦА ТОВАРА -->
<div id="page-detail" class="section">
    <div class="detail-wrap">
        <div class="back-link" onclick="openPage('catalog')">← Назад в каталог</div>
        
        <div class="slider-box">
            <div class="slide-arrow left" onclick="changeSlide(-1)">‹</div>
            <img id="det-main-img" src="" alt="Sneaker">
            <div class="slide-arrow right" onclick="changeSlide(1)">›</div>
        </div>
        <div id="det-dots" class="dots"></div>

        <div id="det-title" class="detail-title"></div>
        <div id="det-code" class="detail-code"></div>

        <div class="detail-prices">
            <span id="det-old-price" class="detail-old"></span>
            <span id="det-cur-price" class="detail-cur"></span>
        </div>

        <div id="det-sizes" class="sizes-grid"></div>

        <div class="size-chart-link" onclick="openSizeModal()">Размерная сетка (см стопы)</div>

        <div class="action-row">
            <button class="btn-black" onclick="buyNowCurrent()">Быстрая покупка</button>
            <button class="btn-outline" onclick="addCurrentToCart()">Добавить в корзину</button>
        </div>

        <div id="det-variants-block" style="display:none;">
            <div class="variants-title">Другие цвета: (<span id="det-color-name"></span>)</div>
            <div id="det-variants" class="variants-row"></div>
        </div>

        <div id="det-desc" class="desc-box"></div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РАЗМЕРНОЙ СЕТКИ -->
<div id="size-modal" class="modal-overlay" onclick="closeSizeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-size:15px; text-transform:uppercase;">📏 Размерная линейка</strong>
            <span style="cursor:pointer; font-size:18px; font-weight:bold;" onclick="closeSizeModal()">✕</span>
        </div>
        <div id="modal-size-content"></div>
        <img id="modal-size-img" src="" style="width:100%; margin-top:10px; display:none; border:1px solid #ddd;">
    </div>
</div>

<!-- 3. КОРЗИНА И ОФОРМЛЕНИЕ ЗАКАЗА -->
<div id="page-cart" class="section pad-section">
    <h2 style="margin-bottom: 14px; font-size:18px; text-transform:uppercase;">Корзина</h2>
    <div id="cart-list"></div>
    
    <div id="cart-summary" style="margin-top: 18px; display: none;">
        <div class="form-group">
            <label>Имя и Фамилия *</label>
            <input type="text" id="ord-name" placeholder="Иван Иванов">
        </div>
        <div class="form-group">
            <label>Номер телефона *</label>
            <input type="tel" id="ord-phone" placeholder="+380...">
        </div>
        <div class="form-group">
            <label>Служба доставки *</label>
            <select id="ord-delivery">
                <option value="Новая Почта">Новая Почта</option>
                <option value="Укрпочта">Укрпочта</option>
                <option value="Самовывоз">Самовывоз</option>
            </select>
        </div>
        <div class="form-group">
            <label>Город *</label>
            <input type="text" id="ord-city" placeholder="Например: Киев">
        </div>
        <div class="form-group">
            <label>Улица и номер отделения / почтомата *</label>
            <input type="text" id="ord-branch" placeholder="Отделение №15 или ул. Крещатик 10">
        </div>
        <div class="form-group">
            <label>Способ оплаты</label>
            <select id="ord-pay">
                <option value="Наложенный платеж (при получении)">При получении (Наложенный платеж)</option>
                <option value="Оплата на карту">Оплата на карту</option>
                <option value="USDT / CryptoBot (@send)">Криптовалюта (USDT / @send)</option>
            </select>
        </div>
        <div id="total-price" style="font-size:18px; font-weight:800; margin: 16px 0;"></div>
        <button class="btn-black" onclick="submitOrder()">Оформить заказ</button>
    </div>
</div>

<!-- 4. АДМИНКА (ТОЛЬКО ДЛЯ ВЛАДЕЛЬЦА) -->
<div id="page-admin" class="section pad-section">
    <h2 style="margin-bottom: 6px; font-size:18px; text-transform:uppercase;">⚙️ Панель владельца</h2>
    <p style="font-size: 12px; color: var(--subtext); margin-bottom: 14px;">
        Вы вошли как администратор (@Endry_sit). Здесь можно добавлять товары, назначать скидки и загружать фото.
    </p>

    <div class="form-group">
        <label>Категория</label>
        <select id="adm-gender">
            <option value="Мужские">Мужские</option>
            <option value="Женские">Женские</option>
            <option value="Унисекс">Унисекс</option>
        </select>
    </div>
    <div class="form-group">
        <label>Бренд (впиши любой)</label>
        <input type="text" id="adm-brand" placeholder="Например: Asics, Nike, Adidas, New Balance">
    </div>
    <div class="form-group">
        <label>Название модели и код</label>
        <input type="text" id="adm-title" placeholder="Asics Gel NYC Graphite Grey Black">
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <div class="form-group">
            <label>Актуальная цена продажи *</label>
            <input type="number" id="adm-price" placeholder="4145">
        </div>
        <div class="form-group">
            <label>Валюта ввода</label>
            <select id="adm-cur">
                <option value="UAH">UAH (₴)</option>
                <option value="USD">USD ($)</option>
                <option value="RUB">RUB (₽)</option>
                <option value="USDT">USDT (₮)</option>
            </select>
        </div>
    </div>

    <!-- ГАЛОЧКА СКИДКИ (ЕСТЬ ИЛИ НЕТ) -->
    <label class="checkbox-row">
        <input type="checkbox" id="adm-has-discount" onchange="toggleDiscountBox()">
        <span>🔥 Назначить скидку на этот товар (перечеркнутая старая цена)</span>
    </label>

    <div id="discount-settings" style="display:none; border:1px solid var(--border); padding:10px; margin-bottom:12px; background:#fafafa;">
        <div class="form-group" style="margin-bottom:0;">
            <label>Старая цена до скидки (в той же валюте)</label>
            <input type="number" id="adm-old-price" placeholder="Например: 8810">
        </div>
    </div>

    <div class="form-group">
        <label>Фотографии товара (можно выбрать несколько сразу)</label>
        <input type="file" id="adm-photos" accept="image/*" multiple onchange="handleMultiPhotos(this)">
        <div id="adm-photo-preview" class="preview-strip"></div>
    </div>

    <div class="form-group">
        <label>Размеры и длина стопы в см (через запятую)</label>
        <textarea id="adm-sizes" rows="3">36=23см, 37=23.5см, 38=24см, 39=24.5см, 40=25см, 41=26см, 42=26.5см, 43=27.5см, 44=28см, 45=29см</textarea>
    </div>

    <div class="form-group">
        <label>Фото размерной сетки (необязательно)</label>
        <input type="file" id="adm-chart-file" accept="image/*" onchange="handleChartPhoto(this)">
    </div>

    <div class="form-group">
        <label>Описание товара</label>
        <textarea id="adm-desc" rows="3" placeholder="Материалы, сезон, особенности модели..."></textarea>
    </div>

    <div style="border:1px solid var(--border); padding:10px; margin-bottom:14px; background:var(--surface);">
        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:6px;">🎨 ДРУГИЕ ЦВЕТА / ВАРИАНТЫ (по желанию)</label>
        <input type="text" id="var-color-name" placeholder="Название цвета (напр. Белый / Серый)" style="margin-bottom:6px;">
        <input type="file" id="var-color-file" accept="image/*" style="margin-bottom:6px;">
        <button type="button" class="btn-outline" style="padding:7px;" onclick="addVariantDraft()">+ Прикрепить этот цвет к товару</button>
        <div id="var-draft-list" class="preview-strip" style="margin-top:8px;"></div>
    </div>

    <button class="btn-black" onclick="saveNewProduct()">✅ Опубликовать товар в магазин</button>
</div>

<div class="bottom-nav">
    <div class="nav-item active" id="nav-catalog" onclick="openPage('catalog')">Каталог</div>
    <div class="nav-item" id="nav-cart" onclick="openPage('cart')">Корзина (<span id="cart-count">0</span>)</div>
    <div class="nav-item" id="nav-admin" style="display:none;" onclick="openPage('admin')">➕ Админ</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // НАДЕЖНАЯ ПРОВЕРКА ПРАВ ВЛАДЕЛЬЦА (@Endry_sit):
    // 1. По секретному параметру ?admin=1, который бот выдает ТОЛЬКО аккаунту @Endry_sit
    // 2. Или по данным Telegram WebApp, если открыто через Inline
    const urlParams = new URLSearchParams(window.location.search);
    const tgUser = (tg.initDataUnsafe?.user?.username || "").toLowerCase();
    let isOwner = (urlParams.get('admin') === '1') || (tgUser === 'endry_sit');

    function unlockAdminUI() {
        isOwner = true;
        document.getElementById('nav-admin').style.display = 'block';
    }

    if (isOwner) {
        unlockAdminUI();
    }

    // Запасной вход для владельца: 5 быстрых нажатий по логотипу SNEAKERS сверху
    let logoTapCount = 0;
    let logoTapTimer = null;
    function handleLogoTap() {
        openPage('catalog');
        logoTapCount++;
        clearTimeout(logoTapTimer);
        logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 1800);
        if (logoTapCount >= 5 && !isOwner) {
            logoTapCount = 0;
            const pin = prompt("Введите PIN владельца для доступа к админке:");
            if (pin === "7777") {
                unlockAdminUI();
                openPage('admin');
            }
        }
    }

    function toggleDiscountBox() {
        const checked = document.getElementById('adm-has-discount').checked;
        document.getElementById('discount-settings').style.display = checked ? 'block' : 'none';
        if (!checked) document.getElementById('adm-old-price').value = '';
    }

    const rates = {
        USD: { rate: 1, sym: '$' },
        USDT: { rate: 1, sym: '₮' },
        UAH: { rate: 41.5, sym: 'грн' },
        RUB: { rate: 96, sym: '₽' }
    };

    const defaultCatalog = [
        {
            id: 2351716,
            code: "S-2351716",
            gender: "Мужские",
            brand: "Asics",
            title: "Asics Gel NYC Graphite Grey Black 1201A789-020",
            priceUSD: 100,
            oldPriceUSD: 212, // На этом демо-товаре скидка включена
            images: [
                "https://images.unsplash.com/photo-1539185441755-769473a23570?w=700",
                "https://images.unsplash.com/photo-1552346154-21d32810aba3?w=700",
                "https://images.unsplash.com/photo-1587563871167-1ee9c731aefb?w=700"
            ],
            sizes: [
                { size: "36", cm: "23 см" }, { size: "37", cm: "23.5 см" },
                { size: "38", cm: "24 см" }, { size: "39", cm: "24.5 см" },
                { size: "40", cm: "25 см" }, { size: "41", cm: "26 см" },
                { size: "42", cm: "26.5 см" }, { size: "43", cm: "27.5 см" },
                { size: "44", cm: "28 см" }, { size: "45", cm: "29 см" }
            ],
            sizeChartImg: "",
            variants: [
                { name: "Graphite Grey", img: "https://images.unsplash.com/photo-1539185441755-769473a23570?w=400" },
                { name: "Pure Silver", img: "https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?w=400" }
            ],
            desc: "Модель Asics Gel-NYC сочетает наследие беговых кроссовок и современную амортизацию GEL.\n• Верх: замша и дышащая сетка\n• Подошва: пена + вставки GEL"
        }
    ];

    let products = JSON.parse(localStorage.getItem('bw_sneaker_catalog_v3')) || defaultCatalog;
    let selectedGender = 'ALL';
    let selectedBrand = 'ALL';

    let activeProduct = null;
    let activeSlideIdx = 0;
    let activeSize = null;
    let activeColor = "";
    let cart = [];

    let uploadedProductPhotos = [];
    let uploadedChartPhoto = "";
    let uploadedVariants = [];

    function formatMoney(usd) {
        if (!usd || usd <= 0) return "";
        const cur = document.getElementById('currency').value;
        const val = Math.round(usd * rates[cur].rate);
        return `${val} ${rates[cur].sym}`;
    }

    function refreshAllPrices() {
        renderCatalog();
        if (activeProduct) openProductDetail(activeProduct.id, false);
        renderCart();
    }

    function renderBrandTabs() {
        const brands = ['ALL', ...new Set(products.map(p => p.brand))];
        const wrap = document.getElementById('brand-tabs');
        wrap.innerHTML = brands.map(b => `
            <button class="tab-btn ${selectedBrand === b ? 'active' : ''}" onclick="setBrand('${b}')">
                ${b === 'ALL' ? 'Все бренды' : b}
            </button>
        `).join('');
    }

    function setGender(g, btn) {
        selectedGender = g;
        document.querySelectorAll('#gender-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCatalog();
    }

    function setBrand(b) {
        selectedBrand = b;
        renderBrandTabs();
        renderCatalog();
    }

    function renderCatalog() {
        renderBrandTabs();
        const q = document.getElementById('search-input').value.toLowerCase().trim();
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        const filtered = products.filter(p => {
            const matchG = selectedGender === 'ALL' || p.gender === selectedGender;
            const matchB = selectedBrand === 'ALL' || p.brand.toLowerCase() === selectedBrand.toLowerCase();
            const matchQ = !q || p.title.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q);
            return matchG && matchB && matchQ;
        });

        filtered.forEach(p => {
            const hasDiscount = p.oldPriceUSD && p.oldPriceUSD > p.priceUSD;
            const oldHtml = hasDiscount ? `<span class="old-price">${formatMoney(p.oldPriceUSD)}</span>` : '';
            const perc = hasDiscount ? Math.round((1 - p.priceUSD / p.oldPriceUSD) * 100) : 0;
            const badgeHtml = hasDiscount ? `<div class="sale-badge">-${perc}%</div>` : '';

            grid.innerHTML += `
                <div class="card" onclick="openProductDetail(${p.id}, true)">
                    ${badgeHtml}
                    <div>
                        <img src="${p.images[0]}" alt="${p.title}">
                        <div class="card-brand">${p.brand} • ${p.gender}</div>
                        <div class="card-title">${p.title}</div>
                    </div>
                    <div class="price-row">
                        ${oldHtml}
                        <span class="cur-price">${formatMoney(p.priceUSD)}</span>
                    </div>
                </div>
            `;
        });
    }

    function openProductDetail(id, resetState = true) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        activeProduct = p;

        if (resetState) {
            activeSlideIdx = 0;
            activeSize = p.sizes && p.sizes.length ? p.sizes[0].size : "41";
            activeColor = p.variants && p.variants.length ? p.variants[0].name : "Базовый";
        }

        document.getElementById('det-title').innerText = p.title;
        document.getElementById('det-code').innerText = `Код товара: ${p.code || 'S-' + p.id} | Категория: ${p.gender}`;
        
        const hasDiscount = p.oldPriceUSD && p.oldPriceUSD > p.priceUSD;
        const oldEl = document.getElementById('det-old-price');
        if (hasDiscount) {
            oldEl.innerText = formatMoney(p.oldPriceUSD);
            oldEl.style.display = 'inline';
        } else {
            oldEl.innerText = '';
            oldEl.style.display = 'none';
        }

        document.getElementById('det-cur-price').innerText = formatMoney(p.priceUSD);
        document.getElementById('det-desc').innerText = p.desc || "Описание отсутствует.";

        updateSliderView();
        renderDetailSizes();
        renderDetailVariants();

        openPage('detail');
    }

    function updateSliderView() {
        const imgs = activeProduct.images;
        document.getElementById('det-main-img').src = imgs[activeSlideIdx] || imgs[0];
        const dotsWrap = document.getElementById('det-dots');
        dotsWrap.innerHTML = imgs.map((_, i) => `
            <span class="dot ${i === activeSlideIdx ? 'active' : ''}" onclick="setSlide(${i})"></span>
        `).join('');
    }

    function changeSlide(dir) {
        const len = activeProduct.images.length;
        activeSlideIdx = (activeSlideIdx + dir + len) % len;
        updateSliderView();
    }

    function setSlide(i) {
        activeSlideIdx = i;
        updateSliderView();
    }

    function renderDetailSizes() {
        const wrap = document.getElementById('det-sizes');
        wrap.innerHTML = (activeProduct.sizes || []).map(s => `
            <div class="size-box ${activeSize === s.size ? 'selected' : ''}" onclick="chooseDetailSize('${s.size}')">
                ${s.size}
            </div>
        `).join('');
    }

    function chooseDetailSize(sz) {
        activeSize = sz;
        renderDetailSizes();
    }

    function renderDetailVariants() {
        const block = document.getElementById('det-variants-block');
        const row = document.getElementById('det-variants');
        const vars = activeProduct.variants || [];

        if (vars.length === 0) {
            block.style.display = 'none';
            return;
        }
        block.style.display = 'block';
        document.getElementById('det-color-name').innerText = activeColor;

        row.innerHTML = vars.map(v => `
            <div class="var-thumb ${activeColor === v.name ? 'active' : ''}" onclick="chooseColorVariant('${v.name}', '${v.img}')">
                <img src="${v.img}" alt="${v.name}">
            </div>
        `).join('');
    }

    function chooseColorVariant(name, img) {
        activeColor = name;
        if (img) document.getElementById('det-main-img').src = img;
        renderDetailVariants();
    }

    function openSizeModal() {
        if (!activeProduct) return;
        const rows = (activeProduct.sizes || []).map(s => `
            <tr><td><b>${s.size}</b></td><td>${s.cm || '-'}</td></tr>
        `).join('');

        document.getElementById('modal-size-content').innerHTML = `
            <p style="font-size:12px; color:#555; margin-bottom:8px;">Модель: <b>${activeProduct.title}</b></p>
            <table class="size-table">
                <thead><tr><th>Размер обуви</th><th>Длина стопы (см)</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        `;

        const chartImg = document.getElementById('modal-size-img');
        if (activeProduct.sizeChartImg) {
            chartImg.src = activeProduct.sizeChartImg;
            chartImg.style.display = 'block';
        } else {
            chartImg.style.display = 'none';
        }
        document.getElementById('size-modal').style.display = 'flex';
    }

    function closeSizeModal() {
        document.getElementById('size-modal').style.display = 'none';
    }

    function addCurrentToCart() {
        if (!activeProduct) return;
        const sizeObj = (activeProduct.sizes || []).find(s => s.size === activeSize) || { size: activeSize, cm: '' };
        cart.push({
            id: activeProduct.id,
            title: activeProduct.title,
            brand: activeProduct.brand,
            priceUSD: activeProduct.priceUSD,
            size: sizeObj.size,
            cm: sizeObj.cm,
            color: activeColor
        });
        document.getElementById('cart-count').innerText = cart.length;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        alert(`Добавлено в корзину: ${activeProduct.title} (Размер ${sizeObj.size})`);
    }

    function buyNowCurrent() {
        addCurrentToCart();
        openPage('cart');
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const sumBlock = document.getElementById('cart-summary');
        list.innerHTML = '';

        if (cart.length === 0) {
            list.innerHTML = '<p style="color:var(--subtext);">Ваша корзина пуста.</p>';
            sumBlock.style.display = 'none';
            return;
        }
        sumBlock.style.display = 'block';
        let totalUSD = 0;

        cart.forEach((item, i) => {
            totalUSD += Number(item.priceUSD);
            list.innerHTML += `
                <div class="cart-item">
                    <div>
                        <div style="font-weight:700; font-size:13px;">${item.title}</div>
                        <div style="font-size:12px; color:var(--subtext);">
                            Размер: <b>${item.size}</b> (${item.cm}) | Цвет: <b>${item.color}</b>
                        </div>
                        <div style="font-weight:800; font-size:13px; margin-top:3px;">${formatMoney(item.priceUSD)}</div>
                    </div>
                    <span style="cursor:pointer; font-weight:bold; padding:6px;" onclick="removeCartItem(${i})">✕</span>
                </div>
            `;
        });
        document.getElementById('total-price').innerText = `К ОПЛАТЕ: ${formatMoney(totalUSD)} ($${Math.round(totalUSD)})`;
    }

    function removeCartItem(i) {
        cart.splice(i, 1);
        document.getElementById('cart-count').innerText = cart.length;
        renderCart();
    }

    function openPage(page) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navEl = document.getElementById('nav-' + page);
        if (navEl) navEl.classList.add('active');
        if (page === 'cart') renderCart();
        window.scrollTo(0, 0);
    }

    function compressImageFile(file, maxWidth = 650, quality = 0.72) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(1, maxWidth / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function handleMultiPhotos(input) {
        uploadedProductPhotos = [];
        const preview = document.getElementById('adm-photo-preview');
        preview.innerHTML = '';
        for (const file of input.files) {
            const dataUrl = await compressImageFile(file, 650, 0.72);
            uploadedProductPhotos.push(dataUrl);
            preview.innerHTML += `<img src="${dataUrl}">`;
        }
    }

    async function handleChartPhoto(input) {
        if (input.files[0]) {
            uploadedChartPhoto = await compressImageFile(input.files[0], 650, 0.72);
        }
    }

    async function addVariantDraft() {
        const name = document.getElementById('var-color-name').value.trim();
        const fileInput = document.getElementById('var-color-file');
        if (!name || !fileInput.files[0]) {
            alert('Укажите название цвета и выберите фото этого варианта!');
            return;
        }
        const dataUrl = await compressImageFile(fileInput.files[0], 350, 0.7);
        uploadedVariants.push({ name, img: dataUrl });
        document.getElementById('var-color-name').value = '';
        fileInput.value = '';
        document.getElementById('var-draft-list').innerHTML = uploadedVariants.map(v => `
            <div style="text-align:center; font-size:10px;"><img src="${v.img}"><div>${v.name}</div></div>
        `).join('');
    }

    function saveNewProduct() {
        if (!isOwner) {
            alert('Доступ запрещен! Только владелец может добавлять товары.');
            return;
        }

        const gender = document.getElementById('adm-gender').value;
        const brand = document.getElementById('adm-brand').value.trim() || 'Sneakers';
        const title = document.getElementById('adm-title').value.trim();
        const rawPrice = Number(document.getElementById('adm-price').value);
        const hasDiscount = document.getElementById('adm-has-discount').checked;
        const rawOldPrice = hasDiscount ? Number(document.getElementById('adm-old-price').value) : 0;
        const inputCur = document.getElementById('adm-cur').value;
        const rawSizes = document.getElementById('adm-sizes').value.trim();
        const desc = document.getElementById('adm-desc').value.trim();

        if (!title || !rawPrice) {
            alert('Заполните название модели и актуальную цену!');
            return;
        }

        if (hasDiscount && (!rawOldPrice || rawOldPrice <= rawPrice)) {
            alert('Старая цена должна быть больше актуальной цены со скидкой!');
            return;
        }

        const priceUSD = +(rawPrice / rates[inputCur].rate).toFixed(2);
        const oldPriceUSD = (hasDiscount && rawOldPrice > 0) ? +(rawOldPrice / rates[inputCur].rate).toFixed(2) : 0;

        const parsedSizes = rawSizes.split(/[,;\n]+/).map(part => {
            const [sz, cm] = part.split('=').map(s => s ? s.trim() : '');
            return sz ? { size: sz, cm: cm || '' } : null;
        }).filter(Boolean);

        const images = uploadedProductPhotos.length > 0
            ? uploadedProductPhotos
            : ['https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600'];

        const newProd = {
            id: Date.now(),
            code: 'S-' + Math.floor(100000 + Math.random() * 900000),
            gender,
            brand,
            title,
            priceUSD,
            oldPriceUSD,
            images,
            sizes: parsedSizes.length ? parsedSizes : [{ size: "41", cm: "26 см" }],
            sizeChartImg: uploadedChartPhoto,
            variants: uploadedVariants.length ? uploadedVariants : [{ name: "Основной", img: images[0] }],
            desc
        };

        products.unshift(newProd);
        localStorage.setItem('bw_sneaker_catalog_v3', JSON.stringify(products));
        renderCatalog();

        tg.sendData(JSON.stringify({
            action: 'add_product',
            product: {
                id: newProd.id,
                code: newProd.code,
                gender: newProd.gender,
                brand: newProd.brand,
                title: newProd.title,
                priceUSD: newProd.priceUSD,
                oldPriceUSD: newProd.oldPriceUSD,
                sizes: newProd.sizes.map(s => `${s.size}(${s.cm})`).join(' '),
                variants: newProd.variants.map(v => v.name).join(', ')
            }
        }));
    }

    function submitOrder() {
        const name = document.getElementById('ord-name').value.trim();
        const phone = document.getElementById('ord-phone').value.trim();
        const delivery = document.getElementById('ord-delivery').value;
        const city = document.getElementById('ord-city').value.trim();
        const branch = document.getElementById('ord-branch').value.trim();
        const payment = document.getElementById('ord-pay').value;
        const currency = document.getElementById('currency').value;

        if (!name || !phone || !city || !branch) {
            alert('Пожалуйста, заполните Имя/Фамилию, телефон, город и отделение доставки!');
            return;
        }

        const totalUSD = Math.round(cart.reduce((s, i) => s + Number(i.priceUSD), 0));

        tg.sendData(JSON.stringify({
            action: 'new_order',
            name,
            phone,
            delivery,
            city,
            branch,
            payment,
            currency,
            total_usd: totalUSD,
            total_converted: formatMoney(totalUSD),
            items: cart.map(i => `${i.title} | Цвет: ${i.color} | Размер: ${i.size} (${i.cm})`)
        }));
    }

    renderCatalog();
</script>

</html>
